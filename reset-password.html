<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — Academia Ensurity</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #0F172A; --navy2: #1E293B; --blue: #2563EB; --blue-h: #1D4ED8;
  --bg: #F8FAFC; --surface: #FFFFFF; --border: #E2E8F0;
  --text: #0F172A; --text2: #64748B;
  --danger: #EF4444; --success: #10B981;
  --shadow: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 20px 40px rgba(0,0,0,.14);
  --radius: 14px; --transition: .18s ease;
}
[data-theme="dark"] {
  --bg: #0F172A; --surface: #1E293B; --border: #334155;
  --text: #F1F5F9; --text2: #94A3B8; --navy: #0B1120; --navy2: #1E293B;
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 40px 36px; width: 100%; max-width: 420px;
}
.logo { text-align: center; margin-bottom: 28px; }
.logo-mark {
  width: 52px; height: 52px; border-radius: 14px;
  background: linear-gradient(135deg, #2563EB, #0891B2);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px; font-size: 1.4rem;
}
.logo h1 { font-size: 1.3rem; font-weight: 800; color: var(--text); }
.logo p  { font-size: .82rem; color: var(--text2); margin-top: 2px; }

.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: .82rem; font-weight: 600; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
.form-group input {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: .93rem; font-family: inherit;
  background: var(--bg); color: var(--text);
  transition: border-color var(--transition), box-shadow var(--transition);
}
.form-group input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 42px; }
.pw-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--text2);
  font-size: 1.1rem; padding: 0; line-height: 1;
}

.btn-primary {
  width: 100%; padding: 12px; background: var(--blue); color: #fff;
  border: none; border-radius: 10px; font-size: .95rem; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: background var(--transition);
  margin-top: 4px;
}
.btn-primary:hover:not(:disabled) { background: var(--blue-h); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }

.msg {
  margin-top: 14px; padding: 10px 14px; border-radius: 8px;
  font-size: .85rem; font-weight: 500; display: none;
}
.msg.error   { background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B; display: block; }
.msg.success { background: #D1FAE5; border: 1px solid #6EE7B7; color: #065F46; display: block; }
[data-theme="dark"] .msg.error   { background: #2d1515; border-color: #7b2d2d; color: #FCA5A5; }
[data-theme="dark"] .msg.success { background: #052e16; border-color: #166534; color: #86EFAC; }

.hint { font-size: .78rem; color: var(--text2); margin-top: 6px; }
.strength-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
.strength-fill { height: 100%; width: 0; border-radius: 2px; transition: width .3s, background .3s; }

.back-link { display: block; text-align: center; margin-top: 20px; font-size: .83rem; color: var(--blue); text-decoration: none; }
.back-link:hover { text-decoration: underline; }

#invalid-token { display: none; text-align: center; }
#invalid-token .icon { font-size: 2.5rem; margin-bottom: 12px; }
#invalid-token h2 { font-size: 1.1rem; margin-bottom: 8px; }
#invalid-token p { font-size: .85rem; color: var(--text2); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">🎓</div>
    <h1>Academia Ensurity</h1>
    <p>Set your new password</p>
  </div>

  <!-- Invalid / expired token state -->
  <div id="invalid-token">
    <div class="icon">⚠️</div>
    <h2>Link expired or invalid</h2>
    <p>This reset link has already been used or has expired. Please request a new one.</p>
    <a href="/" class="back-link" style="margin-top:20px;display:inline-block;">← Back to Sign In</a>
  </div>

  <!-- Reset form -->
  <form id="reset-form" onsubmit="doReset(event)" style="display:none">
    <div class="form-group">
      <label>New Password</label>
      <div class="pw-wrap">
        <input type="password" id="pw1" required minlength="8" placeholder="Min. 8 characters" oninput="checkStrength()"/>
        <button type="button" class="pw-toggle" onclick="togglePw('pw1',this)">👁</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
      <div class="hint" id="strength-label"></div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="pw2" required minlength="8" placeholder="Repeat password"/>
        <button type="button" class="pw-toggle" onclick="togglePw('pw2',this)">👁</button>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="btn-reset">Update Password</button>
    <div class="msg" id="msg"></div>
  </form>

  <a href="/" class="back-link" id="back-link" style="display:none">← Back to Sign In</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabase-config.js"></script>
<script>
(function () {
  // Supabase passes tokens in the URL hash for password recovery
  function getHashParams() {
    var hash = window.location.hash.substring(1);
    var params = {};
    hash.split('&').forEach(function (pair) {
      var parts = pair.split('=');
      if (parts.length === 2) params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
    });
    return params;
  }

  var params = getHashParams();
  var isRecovery = params.type === 'recovery' && params.access_token;

  if (!isRecovery) {
    document.getElementById('invalid-token').style.display = 'block';
  } else {
    document.getElementById('reset-form').style.display = 'block';
    document.getElementById('back-link').style.display = 'block';
    // Set the session so updateUser works
    window._resetToken = params.access_token;
    window._resetRefresh = params.refresh_token || '';
  }

  function togglePw(id, btn) {
    var input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁' : '🙈';
  }
  window.togglePw = togglePw;

  function checkStrength() {
    var pw = document.getElementById('pw1').value;
    var score = 0;
    if (pw.length >= 8)  score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    var fill  = document.getElementById('strength-fill');
    var label = document.getElementById('strength-label');
    var levels = [
      { pct: '20%', color: '#EF4444', text: 'Too weak' },
      { pct: '40%', color: '#F97316', text: 'Weak' },
      { pct: '60%', color: '#EAB308', text: 'Fair' },
      { pct: '80%', color: '#22C55E', text: 'Strong' },
      { pct: '100%', color: '#10B981', text: 'Very strong' },
    ];
    var lvl = levels[Math.max(0, score - 1)] || levels[0];
    fill.style.width = pw.length ? lvl.pct : '0';
    fill.style.background = lvl.color;
    label.textContent = pw.length ? lvl.text : '';
  }
  window.checkStrength = checkStrength;

  window.doReset = async function (e) {
    e.preventDefault();
    var pw1 = document.getElementById('pw1').value;
    var pw2 = document.getElementById('pw2').value;
    var msg = document.getElementById('msg');
    var btn = document.getElementById('btn-reset');
    msg.className = 'msg';
    msg.textContent = '';

    if (pw1 !== pw2) {
      msg.className = 'msg error';
      msg.textContent = 'Passwords do not match.';
      return;
    }
    if (pw1.length < 8) {
      msg.className = 'msg error';
      msg.textContent = 'Password must be at least 8 characters.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating…';
    try {
      // Establish session from token before updating
      await window.AZ.db.auth.setSession({
        access_token: window._resetToken,
        refresh_token: window._resetRefresh,
      });
      await window.AZ.Auth.updatePassword(pw1);
      msg.className = 'msg success';
      msg.textContent = 'Password updated! Redirecting to sign in…';
      setTimeout(function () { window.location.href = '/'; }, 2000);
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err.message || 'Something went wrong. Please request a new reset link.';
      btn.disabled = false;
      btn.textContent = 'Update Password';
    }
  };
})();
</script>
</body>
</html>
