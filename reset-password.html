<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — Academia Ensurity</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #0F172A; --blue: #2563EB; --blue-h: #1D4ED8;
  --bg: #F8FAFC; --surface: #FFFFFF; --border: #E2E8F0;
  --text: #0F172A; --text2: #64748B;
  --danger: #EF4444; --success: #10B981;
  --shadow-lg: 0 20px 40px rgba(0,0,0,.14);
  --radius: 14px; --transition: .18s ease;
}
[data-theme="dark"] {
  --bg: #0F172A; --surface: #1E293B; --border: #334155;
  --text: #F1F5F9; --text2: #94A3B8;
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 40px 36px; width: 100%; max-width: 420px;
}
.logo { text-align: center; margin-bottom: 28px; }
.logo-mark {
  width: 52px; height: 52px; border-radius: 14px;
  background: linear-gradient(135deg, #2563EB, #0891B2);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px; font-size: 1.4rem;
}
.logo h1 { font-size: 1.3rem; font-weight: 800; }
.logo p  { font-size: .82rem; color: var(--text2); margin-top: 2px; }

.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: .82rem; font-weight: 600; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
.form-group input {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: .93rem; font-family: inherit;
  background: var(--bg); color: var(--text);
  transition: border-color var(--transition), box-shadow var(--transition);
}
.form-group input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

.code-input {
  letter-spacing: .3em; font-size: 1.4rem !important;
  text-align: center; font-weight: 700 !important;
}

.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 42px; }
.pw-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--text2);
  font-size: 1.1rem; padding: 0; line-height: 1;
}

.btn-primary {
  width: 100%; padding: 12px; background: var(--blue); color: #fff;
  border: none; border-radius: 10px; font-size: .95rem; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: background var(--transition);
  margin-top: 4px;
}
.btn-primary:hover:not(:disabled) { background: var(--blue-h); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }

.msg {
  margin-top: 14px; padding: 10px 14px; border-radius: 8px;
  font-size: .85rem; font-weight: 500; display: none;
}
.msg.error   { background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B; display: block; }
.msg.success { background: #D1FAE5; border: 1px solid #6EE7B7; color: #065F46; display: block; }
[data-theme="dark"] .msg.error   { background: #2d1515; border-color: #7b2d2d; color: #FCA5A5; }
[data-theme="dark"] .msg.success { background: #052e16; border-color: #166534; color: #86EFAC; }

.hint { font-size: .78rem; color: var(--text2); margin-top: 6px; }
.strength-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
.strength-fill { height: 100%; width: 0; border-radius: 2px; transition: width .3s, background .3s; }

.back-link { display: block; text-align: center; margin-top: 20px; font-size: .83rem; color: var(--blue); text-decoration: none; cursor: pointer; }
.back-link:hover { text-decoration: underline; }

.step-indicator {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 24px;
}
.step-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--border);
  transition: background .3s;
}
.step-dot.active { background: var(--blue); }
.step-line { width: 32px; height: 2px; background: var(--border); border-radius: 1px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">🎓</div>
    <h1>Academia Ensurity</h1>
    <p id="page-subtitle">Password Recovery</p>
  </div>

  <div class="step-indicator">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-line"></div>
    <div class="step-dot" id="dot2"></div>
  </div>

  <!-- Screen 1: email + code -->
  <form id="form-verify" onsubmit="doVerify(event)">
    <p style="font-size:.85rem;color:var(--text2);margin-bottom:18px;text-align:center">
      Enter your email and the 6-digit code sent by Ensurity Group.
    </p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="v-email" required placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Verification Code</label>
      <input type="text" id="v-code" class="code-input" required maxlength="6" pattern="\d{6}" inputmode="numeric" placeholder="000000" autocomplete="one-time-code"/>
      <div class="hint">Check your email from Ensurity Group for the 6-digit code.</div>
    </div>
    <button type="submit" class="btn-primary" id="btn-verify">Verify Code</button>
    <div class="msg" id="msg-verify"></div>
  </form>

  <!-- Screen 2: new password -->
  <form id="form-reset" onsubmit="doReset(event)" style="display:none">
    <p style="font-size:.85rem;color:var(--text2);margin-bottom:18px;text-align:center">
      Code verified! Enter your new password.
    </p>
    <div class="form-group">
      <label>New Password</label>
      <div class="pw-wrap">
        <input type="password" id="pw1" required minlength="8" placeholder="Min. 8 characters" oninput="checkStrength()"/>
        <button type="button" class="pw-toggle" onclick="togglePw('pw1',this)">👁</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
      <div class="hint" id="strength-label"></div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="pw2" required minlength="8" placeholder="Repeat password"/>
        <button type="button" class="pw-toggle" onclick="togglePw('pw2',this)">👁</button>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="btn-reset">Update Password</button>
    <div class="msg" id="msg-reset"></div>
  </form>

  <a class="back-link" href="/">← Back to Sign In</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabase-config.js"></script>
<script>
(function () {
  const EDGE_FN = 'https://qvamdopwbjlccazchoer.supabase.co/functions/v1/bitrix-sync';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2YW1kb3B3YmpsY2NhemNob2VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMTA4ODQsImV4cCI6MjA5Nzg4Njg4NH0.F2VmsQUyBDWXgX_kh8soWOv6W59wWaDRFMlmg6kzHY4';

  // Check for Supabase native reset token in URL hash (fallback for users without Bitrix contact)
  var hashParams = {};
  window.location.hash.substring(1).split('&').forEach(function(p) {
    var kv = p.split('='); if (kv.length === 2) hashParams[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
  });
  if (hashParams.type === 'recovery' && hashParams.access_token) {
    window._resetToken   = hashParams.access_token;
    window._resetRefresh = hashParams.refresh_token || '';
    window._useToken     = true;
    // Skip code verification — go straight to password form
    document.getElementById('form-verify').style.display = 'none';
    document.getElementById('form-reset').style.display  = 'block';
    document.getElementById('dot1').classList.remove('active');
    document.getElementById('dot2').classList.add('active');
    document.getElementById('page-subtitle').textContent = 'Set New Password';
  }

  // Pre-fill email from URL param (?email=...)
  const params = new URLSearchParams(location.search);
  if (params.get('email')) {
    document.getElementById('v-email').value = decodeURIComponent(params.get('email'));
  }

  // Only allow digits in code field
  document.getElementById('v-code').addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 6);
  });

  async function callEdge(payload) {
    const res = await fetch(EDGE_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ANON_KEY },
      body: JSON.stringify(payload),
    });
    return res.json();
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.className = 'msg ' + type;
    el.textContent = text;
  }

  function clearMsg(id) {
    const el = document.getElementById(id);
    el.className = 'msg';
    el.textContent = '';
  }

  window.doVerify = async function (e) {
    e.preventDefault();
    const email = document.getElementById('v-email').value.trim();
    const code  = document.getElementById('v-code').value.trim();
    const btn   = document.getElementById('btn-verify');
    clearMsg('msg-verify');
    btn.disabled = true;
    btn.textContent = 'Verifying…';
    try {
      const d = await callEdge({ action: 'password_reset_verify', email, code });
      if (!d.valid) {
        const reasons = {
          expired:    'Code has expired. Please request a new one.',
          wrong_code: 'Incorrect code. Please check your email and try again.',
          not_found:  'No active code found. Please request a new one.',
        };
        showMsg('msg-verify', reasons[d.reason] || 'Invalid code.', 'error');
        return;
      }
      // Store for step 3
      window._resetEmail = email;
      window._resetCode  = code;
      // Show step 2
      document.getElementById('form-verify').style.display = 'none';
      document.getElementById('form-reset').style.display  = 'block';
      document.getElementById('dot1').classList.remove('active');
      document.getElementById('dot2').classList.add('active');
      document.getElementById('page-subtitle').textContent = 'Set New Password';
      document.getElementById('pw1').focus();
    } catch (err) {
      showMsg('msg-verify', err.message || 'Connection error.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Verify Code';
    }
  };

  window.doReset = async function (e) {
    e.preventDefault();
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    const btn = document.getElementById('btn-reset');
    clearMsg('msg-reset');
    if (pw1 !== pw2) { showMsg('msg-reset', 'Passwords do not match.', 'error'); return; }
    if (pw1.length < 8) { showMsg('msg-reset', 'Password must be at least 8 characters.', 'error'); return; }
    btn.disabled = true;
    btn.textContent = 'Updating…';
    try {
      if (window._useToken) {
        // Supabase native reset (fallback path — no Bitrix contact)
        await window.AZ.db.auth.setSession({ access_token: window._resetToken, refresh_token: window._resetRefresh });
        await window.AZ.Auth.updatePassword(pw1);
      } else {
        // Bitrix code path
        const d = await callEdge({
          action: 'password_reset_complete',
          email: window._resetEmail,
          code:  window._resetCode,
          newPassword: pw1,
        });
        if (d.error) throw new Error(d.error);
      }
      showMsg('msg-reset', 'Password updated! Redirecting to sign in…', 'success');
      setTimeout(function () { window.location.href = '/'; }, 2000);
    } catch (err) {
      showMsg('msg-reset', err.message || 'Something went wrong. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Update Password';
    }
  };

  window.togglePw = function (id, btn) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁' : '🙈';
  };

  window.checkStrength = function () {
    const pw = document.getElementById('pw1').value;
    let score = 0;
    if (pw.length >= 8)  score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const fill  = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');
    const levels = [
      { pct: '20%', color: '#EF4444', text: 'Too weak' },
      { pct: '40%', color: '#F97316', text: 'Weak' },
      { pct: '60%', color: '#EAB308', text: 'Fair' },
      { pct: '80%', color: '#22C55E', text: 'Strong' },
      { pct: '100%', color: '#10B981', text: 'Very strong' },
    ];
    const lvl = levels[Math.max(0, score - 1)] || levels[0];
    fill.style.width = pw.length ? lvl.pct : '0';
    fill.style.background = lvl.color;
    label.textContent = pw.length ? lvl.text : '';
  };
})();
</script>
</body>
</html>
