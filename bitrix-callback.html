<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing in…</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0f2942;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
  .box{text-align:center}
  .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:13px;opacity:.8}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p id="msg">Signing you in…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/supabase-config.js"></script>
<script>
// The Bitrix SSO flow (api/bitrix-sso.js) redirects here after Supabase's
// magic-link /verify step, which appends the session as a URL hash
// fragment (#access_token=...&refresh_token=...). Relying on the main
// page's automatic detectSessionInUrl handling raced against its own
// getSession() check on load — sometimes losing, landing on the normal
// sign-in form instead of the dashboard. This page removes the race by
// explicitly waiting for setSession() to resolve before navigating away.
(async function () {
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const access_token = hash.get('access_token');
  const refresh_token = hash.get('refresh_token');

  if (!access_token || !refresh_token) {
    document.getElementById('msg').textContent = 'Missing session data — redirecting to sign in…';
    setTimeout(() => { window.location.replace('/'); }, 1500);
    return;
  }

  try {
    const { error } = await AZ.db.auth.setSession({ access_token, refresh_token });
    if (error) throw error;
  } catch (e) {
    document.getElementById('msg').textContent = 'Sign-in failed — redirecting…';
    setTimeout(() => { window.location.replace('/'); }, 1500);
    return;
  }

  window.location.replace('/');
})();
</script>
</body>
</html>
