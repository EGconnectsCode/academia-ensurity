<script>
// Auth gate — show app only after verifying session
window._activeTab = 0;
window._libLang = localStorage.getItem('az_lang') === 'es' ? 'es' : 'en';

function syncLangUI(lang) {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const activeColor = isDark ? '#F1F5F9' : '#0F172A';
  const activeBg    = isDark ? '#1E293B' : '#fff';
  const inactiveColor = '#64748B';
  document.getElementById('lib-btn-en').style.background = lang === 'en' ? activeBg : 'transparent';
  document.getElementById('lib-btn-en').style.color      = lang === 'en' ? activeColor : inactiveColor;
  document.getElementById('lib-btn-en').style.boxShadow  = lang === 'en' ? '0 1px 3px rgba(0,0,0,.15)' : 'none';
  document.getElementById('lib-btn-es').style.background = lang === 'es' ? activeBg : 'transparent';
  document.getElementById('lib-btn-es').style.color      = lang === 'es' ? activeColor : inactiveColor;
  document.getElementById('lib-btn-es').style.boxShadow  = lang === 'es' ? '0 1px 3px rgba(0,0,0,.15)' : 'none';
  const tabs = document.querySelectorAll('.tlh-tab');
  if (tabs[0]) tabs[0].textContent = lang === 'es' ? 'Plataforma' : 'Platform';
  if (tabs[1]) tabs[1].textContent = lang === 'es' ? 'Biblioteca' : 'Library';
}

function setLibLang(lang) {
  window._libLang = lang;
  localStorage.setItem('az_lang', lang);
  syncLangUI(lang);
  window.renderActiveTab();
}

function toggleTLHDark() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('az_theme', next);
  document.getElementById('tlh-icon-moon').style.display = next === 'dark' ? 'none' : 'block';
  document.getElementById('tlh-icon-sun').style.display  = next === 'dark' ? 'block' : 'none';
  setLibLang(window._libLang);
}

// Apply saved dark mode icon on load
(function() {
  if (localStorage.getItem('az_theme') === 'dark') {
    document.getElementById('tlh-icon-moon').style.display = 'none';
    document.getElementById('tlh-icon-sun').style.display  = 'block';
  }
})();

// Apply saved language (shared with main dashboard) on load
syncLangUI(window._libLang);

function setTab(idx) {
  window._activeTab = idx;
  document.querySelectorAll('.tlh-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  window.renderActiveTab();
}

async function boot() {
  const waitAZ = () => new Promise(r => { const t = setInterval(() => { if (window.AZ) { clearInterval(t); r(); } }, 80); });
  await waitAZ();
  const user = await window.AZ.Auth.getCurrentUser();
  if (!user) { window.location.href = '/'; return; }
  document.getElementById('app-shell').style.display = 'block';
  renderActiveTab();
}
boot();
</script>

  { id:"fundamentos-seguro", unit:"Fundamentos del Seguro", title:"Fundamentos del Seguro", titleEN:"Insurance Fundamentals", icon:"📘", color:"from-sky-600 to-blue-400", summary:"Conceptos básicos del seguro y contract law que aparecen mucho en el examen de Texas.", keyPoints:["El interés asegurable debe existir cuando se compra o emite la póliza.","Adhesión significa que la aseguradora redacta el contrato.","Aleatorio significa que hay un intercambio desigual.","Indemnización intenta restaurar financieramente a una persona después de una pérdida.","Representaciones son declaraciones que se creen verdaderas.","La Ley de los Grandes Números ayuda a las aseguradoras a predecir pérdidas."], quickTable:[["Adhesión","Aseguradora redacta","Ambigüedad favorece al asegurado"],["Aleatorio","Intercambio desigual","Prima vs beneficio grande"],["Interés Asegurable","Relación financiera/emocional","Requerido al inicio"],["Representación","Se cree verdadera","No es garantía absoluta"]], examTrap:"El interés asegurable en seguro de vida se requiere al emitir/comprar la póliza, no necesariamente al momento de la muerte.", summaryEN:"Core insurance concepts and contract law that appear frequently on the Texas exam.", keyPointsEN:["Insurable interest must exist when the policy is purchased or issued.","Adhesion means the insurer writes the contract.","Aleatory means there is an unequal exchange.","Indemnity attempts to restore a person financially after a loss.","Representations are statements believed to be true.","The Law of Large Numbers helps insurers predict losses."], quickTableEN:[["Adhesion","Insurer writes it","Ambiguity favors the insured"],["Aleatory","Unequal exchange","Premium vs. large benefit"],["Insurable Interest","Financial/emotional relationship","Required at inception"],["Representation","Believed true","Not an absolute guarantee"]], examTrapEN:"Insurable interest for life insurance is required at policy issue/purchase, not necessarily at the time of death." },
  { id:"basicos-vida", unit:"Tipos de Pólizas de Vida", title:"Fundamentos del Seguro de Vida", titleEN:"Life Insurance Basics", icon:"🛡️", color:"from-blue-500 to-cyan-400", summary:"Aprende los tipos principales de pólizas y cómo el examen las compara.", keyPoints:["Term Life es protección temporal sin cash value.","Whole Life es cobertura permanente con primas fijas y cash value garantizado.","Universal Life es flexible: primas flexibles y death benefit ajustable.","Variable Life involucra inversiones, separate accounts y regulación de securities."], quickTable:[["Term Life","Temporal","Sin cash value","Protección pura por fallecimiento"],["Whole Life","Permanente","Cash value","Prima fija"],["Universal Life","Permanente","Cash value","Prima flexible"],["Variable Life","Permanente","Separate account","Riesgo de inversión"]], examTrap:"Universal = flexibilidad. Variable = inversiones. No los confundas.", summaryEN:"Learn the main policy types and how the exam compares them.", keyPointsEN:["Term Life is temporary protection with no cash value.","Whole Life is permanent coverage with fixed premiums and guaranteed cash value.","Universal Life is flexible: flexible premiums and an adjustable death benefit.","Variable Life involves investments, separate accounts, and securities regulation."], quickTableEN:[["Term Life","Temporary","No cash value","Pure death protection"],["Whole Life","Permanent","Cash value","Fixed premium"],["Universal Life","Permanent","Cash value","Flexible premium"],["Variable Life","Permanent","Separate account","Investment risk"]], examTrapEN:"Universal = flexibility. Variable = investments. Don't confuse them." },
  { id:"riders", unit:"Riders", title:"Riders de Seguro de Vida", titleEN:"Life Insurance Riders", icon:"📑", color:"from-purple-500 to-pink-400", summary:"Los riders modifican una póliza agregando beneficios o cobertura extra.", keyPoints:["Waiver of Premium exonera primas si el asegurado queda discapacitado.","Guaranteed Insurability permite aumentos futuros sin prueba de insurability.","Payor Rider es común en pólizas juveniles si el adulto pagador muere o queda discapacitado.","Accidental Death Benefit paga un beneficio adicional por muerte accidental cubierta.","Long-Term Care Rider puede acelerar el death benefit para necesidades de cuidado prolongado."], quickTable:[["Waiver of Premium","Discapacidad","Primas exoneradas"],["Guaranteed Insurability","Cobertura futura","Sin preguntas médicas"],["Payor Rider","Póliza juvenil","Protege si el adulto pagador muere/discapacita"],["ADB","Muerte accidental","Beneficio adicional"]], examTrap:"Un rider no es una póliza separada. Se agrega a una póliza para modificarla.", summaryEN:"Riders modify a policy by adding extra benefits or coverage.", keyPointsEN:["Waiver of Premium waives premiums if the insured becomes disabled.","Guaranteed Insurability allows future increases without proof of insurability.","Payor Rider is common on juvenile policies if the adult payor dies or becomes disabled.","Accidental Death Benefit pays an additional benefit for a covered accidental death.","Long-Term Care Rider can accelerate the death benefit for extended care needs."], quickTableEN:[["Waiver of Premium","Disability","Premiums waived"],["Guaranteed Insurability","Future coverage","No medical questions"],["Payor Rider","Juvenile policy","Protects if the adult payor dies/becomes disabled"],["ADB","Accidental death","Additional benefit"]], examTrapEN:"A rider is not a separate policy. It's added to a policy to modify it." },
  { id:"provisiones", unit:"Provisiones de Póliza", title:"Provisiones y Beneficiarios", titleEN:"Provisions & Beneficiaries", icon:"👥", color:"from-rose-500 to-red-400", summary:"Las provisiones explican cómo funciona el contrato y quién controla los beneficios.", keyPoints:["El policyowner controla derechos de la póliza salvo limitaciones como beneficiario irrevocable.","Beneficiarios revocables pueden cambiarse sin permiso.","Beneficiarios irrevocables requieren consentimiento escrito para cambios.","Incontestability normalmente limita disputas después de dos años, excepto fraude u otras excepciones.","Grace Period ocurre antes del lapse; Reinstatement ocurre después del lapse."], quickTable:[["Beneficiario Primario","Primero","Recibe el death benefit primero"],["Beneficiario Contingente","Respaldo","Cobra si el primario no puede"],["Revocable","Se puede cambiar","No necesita permiso"],["Irrevocable","Protegido","Requiere permiso"]], examTrap:"Las preguntas de beneficiarios casi siempre preguntan quién cobra o si se necesita permiso.", summaryEN:"Provisions explain how the contract works and who controls the benefits.", keyPointsEN:["The policyowner controls policy rights except for limitations like an irrevocable beneficiary.","Revocable beneficiaries can be changed without permission.","Irrevocable beneficiaries require written consent for changes.","Incontestability generally limits disputes after two years, except for fraud or other exceptions.","The Grace Period occurs before lapse; Reinstatement occurs after lapse."], quickTableEN:[["Primary Beneficiary","First","Receives the death benefit first"],["Contingent Beneficiary","Backup","Collects if the primary cannot"],["Revocable","Can be changed","No permission needed"],["Irrevocable","Protected","Requires permission"]], examTrapEN:"Beneficiary questions almost always ask who collects or whether permission is needed." },
  { id:"opciones-poliza", unit:"Opciones de Póliza", title:"Opciones de la Póliza", titleEN:"Policy Options", icon:"💰", color:"from-indigo-500 to-violet-400", summary:"Opciones que explican cómo se usan cash values, dividendos y death benefits.", keyPoints:["Settlement options determinan cómo se pagan los proceeds del death benefit.","Fixed Period paga durante un período seleccionado.","Fixed Amount paga una cantidad seleccionada hasta que se acaben los fondos.","Extended Term da la mayor cantidad de protección.","Reduced Paid-Up da la mayor duración de protección."], quickTable:[["Cash Surrender","Toma cash value","La póliza termina"],["Extended Term","Mayor cantidad","Cobertura term temporal"],["Reduced Paid-Up","Mayor duración","Póliza permanente más pequeña"],["Dividendos","Pólizas participantes","No garantizados"]], examTrap:"Extended Term = mayor cantidad. Reduced Paid-Up = mayor duración.", summaryEN:"Options that explain how cash values, dividends, and death benefits are used.", keyPointsEN:["Settlement options determine how death benefit proceeds are paid.","Fixed Period pays for a selected period of time.","Fixed Amount pays a selected amount until funds run out.","Extended Term gives the largest amount of protection.","Reduced Paid-Up gives the longest duration of protection."], quickTableEN:[["Cash Surrender","Takes cash value","The policy ends"],["Extended Term","Largest amount","Temporary term coverage"],["Reduced Paid-Up","Longest duration","Smaller permanent policy"],["Dividends","Participating policies","Not guaranteed"]], examTrapEN:"Extended Term = largest amount. Reduced Paid-Up = longest duration." },
  { id:"discapacidad", unit:"Disability Income", title:"Disability Income Insurance", titleEN:"Disability Income Insurance", icon:"💼", color:"from-amber-500 to-orange-400", summary:"Disability Income reemplaza ingresos perdidos cuando alguien no puede trabajar por enfermedad o lesión.", keyPoints:["Own Occupation es más liberal porque se enfoca en si puede hacer su propio trabajo.","Any Occupation es más restrictivo porque evalúa cualquier trabajo razonable.","Elimination Period es el tiempo de espera antes de que empiecen los beneficios; entre más largo, menor la prima.","Benefit Period es cuánto tiempo se pagan los beneficios; entre más largo, mayor la prima.","Residual Disability se basa en pérdida de ingresos al regresar al trabajo.","Discapacidad Presuntiva (Presumptive Disability): ciertas condiciones (cuadriplejia, ceguera o sordera permanente, pérdida de 2 extremidades) califican automáticamente para el beneficio total, sin necesidad de más prueba.","Discapacidad Recurrente (Recurrent Disability): una discapacidad similar a una anterior se considera continuación del período previo, retomando donde quedó el elimination o benefit period.","Período Probatorio (Probationary Period): aplica a condiciones preexistentes, empieza cuando se emite la póliza; no aplica a accidentes o lesiones.","Lesión Corporal Accidental (Accidental Bodily Injury) es la definición más liberal — el daño debe ser inesperado; Medios Accidentales (Accidental Means) es más estricta — la causa del accidente debe ser inesperada.","Business Overhead Expense: la compra un dueño de negocio pequeño para cubrir renta, salarios y gastos del negocio (no reemplaza su ingreso personal); las primas son deducibles como gasto de negocio.","Key Person Disability: protege a la empresa si una persona con conocimientos o contactos clave queda discapacitada; primas pagadas por la empresa (no deducibles), beneficios no gravables.","Group Disability: a corto plazo dura entre 13 y 26 semanas; a largo plazo puede durar más de 2 años; generalmente cubre solo fuera del trabajo (lo del trabajo lo cubre Compensación al Trabajador)."], quickTable:[["Own Occupation","Más liberal","No puede hacer su propio trabajo"],["Any Occupation","Más restrictivo","No puede hacer ningún trabajo adecuado"],["Elimination Period","Tiempo de espera","Antes de beneficios"],["Residual Disability","Pérdida de ingreso","Ingresos reducidos"],["Presumptive Disability","Condición específica","Beneficio total automático"],["Probationary Period","Condición preexistente","No aplica a accidentes"]], examTrap:"Partial Disability trata sobre tareas reducidas. Residual Disability se enfoca en ingresos reducidos. Presumptive Disability no requiere ni elimination period para calificar en esas condiciones específicas.", summaryEN:"Disability Income replaces lost income when someone can't work due to illness or injury.", keyPointsEN:["Own Occupation is more liberal because it focuses on whether you can perform your own job.","Any Occupation is more restrictive because it evaluates any reasonable job.","The Elimination Period is the waiting time before benefits begin; the longer it is, the lower the premium.","The Benefit Period is how long benefits are paid; the longer it is, the higher the premium.","Residual Disability is based on loss of income upon returning to work.","Presumptive Disability: certain conditions (quadriplegia, permanent blindness or deafness, loss of 2 limbs) automatically qualify for full disability benefits, with no further proof needed.","Recurrent Disability: a disability similar to a prior one is treated as a continuation of the earlier period, picking up where the elimination or benefit period left off.","Probationary Period: applies to pre-existing conditions, starts when the policy is first issued; does not apply to accidents or injuries.","Accidental Bodily Injury is the more liberal definition — the damage must be unexpected; Accidental Means is stricter — the cause of the accident must be unexpected.","Business Overhead Expense: purchased by a small business owner to cover rent, salaries, and business expenses (does not replace their personal income); premiums are deductible as a business expense.","Key Person Disability: protects the business if someone with specialized knowledge or contacts becomes disabled; premiums paid by the business (not deductible), benefits not taxable.","Group Disability: short-term lasts 13 to 26 weeks; long-term can last more than 2 years; generally covers off-the-job only (on-the-job is covered by Workers' Compensation)."], quickTableEN:[["Own Occupation","More liberal","Cannot perform own job"],["Any Occupation","More restrictive","Cannot perform any suitable job"],["Elimination Period","Waiting time","Before benefits"],["Residual Disability","Income loss","Reduced income"],["Presumptive Disability","Specific condition","Automatic full benefit"],["Probationary Period","Pre-existing condition","Doesn't apply to accidents"]], examTrapEN:"Partial Disability deals with reduced duties. Residual Disability focuses on reduced income. Presumptive Disability doesn't even require the elimination period to qualify under those specific conditions." },
  { id:"medicare", unit:"Medicare y Medicaid", title:"Medicare y Medicaid", titleEN:"Medicare & Medicaid", icon:"🏥", color:"from-emerald-500 to-green-400", summary:"Medicare normalmente prueba qué cubre cada parte y cómo difieren supplements/Medicaid.", keyPoints:["Parte A cubre atención relacionada con hospital, sin prima si el asegurado califica; cubre los primeros 90 días de hospitalización por período de beneficio, con deducible y copagos diarios.","Parte A — Cuidado en Enfermería Especializada (Skilled Nursing): requiere 3 días de hospitalización previa; los primeros 20 días de los 100 cubiertos son pagados 100% por Medicare.","Parte B cubre servicios médicos y outpatient; tiene prima opcional, deducible y coseguro del 20% SIN límite de gasto de bolsillo (stop loss).","Parte C es Medicare Advantage mediante HMOs o PPOs privados aprobados; hay que estar inscrito en las Partes A y B; puede cubrir medicamentos, exámenes de la vista, audífonos y dental.","Parte D cubre medicamentos recetados (prima y deducible opcionales); el plan paga 75% del costo hasta llegar al límite, luego entra el 'Donut Hole' donde el asegurado paga 50% del costo de venta al público.","Medigap (Medicare Supplement): vendido por aseguradoras privadas; Planes A-N; el Plan A tiene los beneficios básicos/core (obligatorios en todos los planes) pero NO cubre el deducible de la Parte A.","Emisión Garantizada de Medigap: se obtiene durante un período de inscripción abierta de 6 meses al inscribirse en la Parte B, sin importar el estado de salud; puede tener un período de condición preexistente de hasta 6 meses.","Medicaid es un programa estatal y federal basado en necesidad (prueba de ingresos y activos) — es asistencia médica sin importar la edad.","Elegibilidad para Medicare: personas de 65+, trabajadores discapacitados menores de 65 con 24+ meses recibiendo beneficios de Seguro Social, y quienes necesitan diálisis renal."], quickTable:[["Parte A","Hospital","Hospital, SNF, hospice"],["Parte B","Médico","Doctores, outpatient, DME — 20% coseguro sin stop loss"],["Parte C","Advantage","Alternativa privada vía HMO/PPO"],["Parte D","Medicamentos","75% hasta el límite, luego Donut Hole al 50%"],["Medigap Plan A","Core benefits","No cubre deducible de Parte A"]], examTrap:"Parte C no es un supplement. Es Medicare Advantage, una forma alternativa de recibir beneficios Medicare. Y la Parte B NO tiene stop loss — el coseguro del 20% sigue aplicando sin límite.", summaryEN:"Medicare usually tests what each part covers and how supplements/Medicaid differ.", keyPointsEN:["Part A covers hospital-related care, premium-free if the insured qualifies; covers the first 90 days of hospitalization per benefit period, with a deductible and daily copays.","Part A — Skilled Nursing Care: requires 3 days of prior hospitalization; the first 20 of the 100 covered days are paid 100% by Medicare.","Part B covers medical and outpatient services; has an optional premium, a deductible, and 20% coinsurance with NO stop loss (out-of-pocket maximum).","Part C is Medicare Advantage through approved private HMOs or PPOs; you must be enrolled in Parts A and B; it may cover prescriptions, eye exams, hearing aids, and dental.","Part D covers prescription drugs (optional premium and deductible); the plan pays 75% of the cost until the benefit limit is reached, then the 'Donut Hole' kicks in, where the insured pays 50% of the retail drug cost.","Medigap (Medicare Supplement): sold by private insurers; Plans A-N; Plan A has the core/basic benefits (required in every plan) but does NOT cover the Medicare Part A deductible.","Guaranteed Issue for Medigap: available during a 6-month open enrollment period upon enrolling in Part B, regardless of health status; it may have a pre-existing condition period of up to 6 months.","Medicaid is a state and federal needs-based program (income and asset test) — it's medical assistance regardless of age.","Medicare eligibility: people 65+, disabled workers under 65 with 24+ months receiving Social Security benefits, and those who need kidney dialysis."], quickTableEN:[["Part A","Hospital","Hospital, SNF, hospice"],["Part B","Medical","Doctors, outpatient, DME — 20% coinsurance, no stop loss"],["Part C","Advantage","Private alternative via HMO/PPO"],["Part D","Drugs","75% until the limit, then the Donut Hole at 50%"],["Medigap Plan A","Core benefits","Doesn't cover the Part A deductible"]], examTrapEN:"Part C is not a supplement. It's Medicare Advantage, an alternative way to receive Medicare benefits. And Part B has NO stop loss — the 20% coinsurance keeps applying with no limit." },
  { id:"underwriting-ley", unit:"Underwriting y Ley de Texas", title:"Underwriting y Ley de Texas", titleEN:"Underwriting & TX Law", icon:"⚖️", color:"from-slate-700 to-slate-500", summary:"Aplicaciones, representations, MIB, prácticas injustas, y las reglas de licenciamiento y estatutos de Texas más importantes para el examen.", keyPoints:["Underwriting determina riesgo y elegibilidad.","Las declaraciones de aplicación suelen ser representations, no warranties (garantías absolutas).","MIB ayuda a revisar información médica/underwriting previa; es una organización sin fines de lucro formada por aseguradoras.","Rebating es ofrecer incentivos no incluidos en la póliza (incluye dar parte de tu comisión).","Twisting es reemplazo engañoso de una póliza existente mintiendo sobre los beneficios.","Coacción (Coercion) es forzar la compra de un asegurador específico — es ilegal y se considera restricción del comercio.","Para obtener una licencia en Texas: tener 18 años, tomar huellas dactilares y aprobar el examen.","Las licencias de agente vencen cada 2 años, en el cumpleaños del agente; requieren 24 horas de educación continua cada 2 años, incluyendo 2-3 horas de ética.","El Comisionado debe auditar a todas las aseguradoras autorizadas al menos una vez cada 5 años, y puede hacerlo con más frecuencia si lo considera necesario.","Multa máxima por violar el Código de Seguros de Texas: $25,000; por violar una orden de cese y desista: $1,000 por violación, hasta $5,000 en total.","Una licencia revocada requiere esperar 5 años antes de poder solicitar una nueva.","Seguro de Vida Grupal: el empleador recibe la póliza maestra y los empleados reciben Certificados de Seguro; período de gracia de 31 días; se puede convertir a una póliza individual (solo Whole Life, nunca Term) dentro de 31 días sin prueba de asegurabilidad.","Free Look (derecho de cancelación): 10 días en general desde la entrega de la póliza; 30 días para Medicare Supplement y Cuidado a Largo Plazo.","Viatical Settlement: el asegurado (terminalmente enfermo) cede su póliza a un tercero y recibe un porcentaje del monto nominal; Life Settlement es similar pero no requiere enfermedad terminal.","Medicare Supplement en Texas: emisión garantizada durante un período de inscripción abierta de 6 meses al inscribirse en la Parte B de Medicare; puede tener hasta 6 meses de período de condición preexistente.","Cuidado a Largo Plazo en Texas: el período máximo de condición preexistente es 24 meses para menores de 65 años, y 6 meses para 65 años o más; no puede requerir hospitalización previa como condición de cobertura.","Los hijos dependientes se cubren hasta los 26 años (sin límite de edad si son discapacitados); los recién nacidos están cubiertos desde el nacimiento, notificando a la aseguradora dentro de 31 días.","Bajo COBRA, empleadores con 20+ empleados deben extender la cobertura grupal a empleados terminados: 18 meses en general, 36 meses por muerte del empleado, divorcio o separación legal.","Las pruebas de VIH requieren consentimiento escrito previo, y los resultados no pueden divulgarse sin el consentimiento del solicitante.","Reinstatement (reincorporación) en salud: si la aseguradora no aprueba ni rechaza la solicitud dentro de 45 días, la póliza se reincorpora automáticamente."], quickTable:[["Representation","Se cree verdadera","Declaración de aplicación"],["MIB","Información médica","Fuente de underwriting"],["Rebating","Incentivo ilegal","No está en póliza"],["Twisting","Reemplazo engañoso","Práctica injusta"],["Free Look","10 días (30 Med Supp/LTC)","Desde entrega de póliza"],["Licencia","Vence cada 2 años","En el cumpleaños del agente"]], examTrap:"Rebating = incentivo extra (compartir tu comisión). Twisting = reemplazo engañoso de una póliza. No los confundas con Coercion, que es forzar la compra de un asegurador específico.", summaryEN:"Applications, representations, MIB, unfair practices, and the licensing rules and Texas statutes most likely to appear on the exam.", keyPointsEN:["Underwriting determines risk and eligibility.","Application statements are usually representations, not warranties (absolute guarantees).","MIB helps review prior medical/underwriting information; it's a non-profit organization formed by insurers.","Rebating is offering incentives not included in the policy (including sharing part of your commission).","Twisting is deceptively replacing an existing policy by lying about its benefits.","Coercion is forcing the purchase of insurance from a specific insurer — it's illegal and considered a restraint of trade.","To get licensed in Texas: be 18 years old, be fingerprinted, and pass the exam.","Agent licenses expire every 2 years, on the agent's birthday; they require 24 hours of continuing education every 2 years, including 2-3 hours of ethics.","The Commissioner must audit all authorized insurers at least once every 5 years, and may do so more often if deemed necessary.","Maximum fine for violating the Texas Insurance Code: $25,000; for violating a cease-and-desist order: $1,000 per violation, up to $5,000 total.","A revoked license requires a 5-year wait before applying for a new one.","Group Life Insurance: the employer receives the master policy and employees receive Certificates of Insurance; 31-day grace period; can be converted to an individual policy (Whole Life only, never Term) within 31 days without proof of insurability.","Free Look: 10 days generally from policy delivery; 30 days for Medicare Supplement and Long-Term Care.","Viatical Settlement: a terminally ill insured assigns their policy to a third party and receives a percentage of the face amount; a Life Settlement is similar but doesn't require terminal illness.","Medicare Supplement in Texas: guaranteed issue during a 6-month open enrollment period upon enrolling in Medicare Part B; may have up to a 6-month pre-existing condition period.","Long-Term Care in Texas: the maximum pre-existing condition period is 24 months for those under 65, and 6 months for those 65 or older; it may not require prior hospitalization as a condition of coverage.","Dependent children are covered up to age 26 (no age limit if handicapped); newborns are covered from birth, with the insurer notified within 31 days.","Under COBRA, employers with 20+ employees must extend group coverage to terminated employees: 18 months generally, 36 months for the employee's death, divorce, or legal separation.","HIV testing requires prior written consent, and results cannot be released without the applicant's consent.","Reinstatement in health insurance: if the insurer doesn't approve or reject the application within 45 days, the policy is automatically reinstated."], quickTableEN:[["Representation","Believed true","Application statement"],["MIB","Medical information","Underwriting source"],["Rebating","Illegal incentive","Not in the policy"],["Twisting","Deceptive replacement","Unfair practice"],["Free Look","10 days (30 Med Supp/LTC)","From policy delivery"],["License","Expires every 2 years","On the agent's birthday"]], examTrapEN:"Rebating = extra incentive (sharing your commission). Twisting = deceptive policy replacement. Don't confuse them with Coercion, which is forcing the purchase from a specific insurer." },
  { id:"examen-solicitudes", unit:"Consejos para el Examen y Solicitudes", title:"Consejos para el Examen y Proceso de Solicitud", titleEN:"Exam Tips & Application Process", icon:"🎯", color:"from-cyan-600 to-teal-400", summary:"Consejos prácticos para el día del examen, más el proceso completo de solicitud: underwriting de campo, elementos del contrato, representations vs. fraude, y clasificación de riesgo.", keyPoints:["El examen de Texas tiene 145 preguntas (130 califican, 15 son de prueba); necesitas acertar el 70% para aprobar.","El interés asegurable debe existir al momento de la solicitud/emisión de la póliza, no necesariamente cuando se paga un beneficio.","Representation es una declaración que se cree verdadera pero no está garantizada; Warranty es una declaración absolutamente verdadera de la que depende la validez del contrato.","El fraude puede anular la póliza dentro de los primeros 2 años; después de eso, en vida aplica el Período de Incontestabilidad y el reclamo no puede negarse por declaraciones de la solicitud.","La cobertura nunca puede comenzar sin que se haya pagado la prima, y solo puede iniciar tan pronto como la fecha de la solicitud si no hay condiciones pendientes y no hubo mentiras.","Un recibo condicional solo se entrega si se paga la prima con la solicitud; si no se pagó, el agente entrega la póliza y el asegurado firma una Declaración de Buena Salud.","Clasificación de riesgo: Preferido (mejor estilo de vida, prima más baja), Estándar (mayoría de personas, tasa estándar), Subestándar (alto riesgo, rate-up o enmienda), Rechazado (riesgo demasiado alto).","El underwriter determina la clasificación final de riesgo, no el productor/agente.","Fuentes de información de underwriting: solicitud y reporte del agente, examen paramédico (salud actual), Declaración del Médico Tratante/APS (salud pasada), MIB (información médica adversa) y reportes de consumidor (crédito, carácter, reputación).","Los elementos de un contrato legal son: Consideración, Oferta, Aceptación y Propósito Legal (COAL, por sus siglas en inglés).","Los contratos de seguro son condicionales, unilaterales, de adhesión y aleatorios — solo la aseguradora está legalmente obligada a pagar.","El Buyer's Guide y el Policy Summary deben entregarse al solicitante antes de aceptar la prima inicial.","Bajo la Ley Gramm-Leach-Bliley, la aseguradora no puede divulgar información personal no pública a un tercero no afiliado.","Bajo el USA Patriot Act, las transacciones mayores a $5,000 requieren un Reporte de Actividad Sospechosa (SAR) dentro de 30 días."], quickTable:[["Representation","Se cree verdadera","No garantizada"],["Warranty","Absolutamente verdadera","La validez del contrato depende de ella"],["Preferido","Mejor salud/estilo de vida","Prima más baja que Estándar"],["Subestándar","Alto riesgo","Rate-up, enmienda o contraoferta"]], examTrap:"El interés asegurable se requiere al inicio (solicitud/emisión), no al momento del reclamo — y es el asegurado, no el beneficiario, quien debe tener interés asegurable.", summaryEN:"Practical tips for exam day, plus the full application process: field underwriting, contract elements, representations vs. fraud, and risk classification.", keyPointsEN:["The Texas exam has 145 questions (130 scored, 15 pretest); you need 70% to pass.","Insurable interest must exist at the time of application/policy issue, not necessarily when a benefit is paid.","A representation is a statement believed to be true but not guaranteed; a warranty is an absolutely true statement the validity of the contract depends on.","Fraud can void the policy within the first 2 years; after that, life insurance's Period of Incontestability applies and the claim cannot be denied based on application statements.","Coverage can never begin unless the premium has been paid, and can start as early as the application date only if there are no pending conditions and no lies were told.","A conditional receipt is only issued if premium is paid with the application; if not, the agent delivers the policy and the insured signs a Statement of Good Health.","Risk classification: Preferred (healthier lifestyle, lower premium), Standard (majority of people, standard rate), Substandard (high risk, rate-up or amendment), Declined (too high a risk).","The underwriter determines the final risk classification, not the producer/agent.","Underwriting information sources: application and agent report, paramedical exam (current health), Attending Physician Statement/APS (past health), MIB (adverse medical information), and consumer reports (credit, character, reputation).","The elements of a legal contract are: Consideration, Offer, Acceptance, and Legal purpose (COAL).","Insurance contracts are conditional, unilateral, adhesion, and aleatory — only the insurer is legally bound to pay.","The Buyer's Guide and Policy Summary must be left with the applicant before accepting the initial premium.","Under the Gramm-Leach-Bliley Act, an insurer may not disclose nonpublic personal information to a nonaffiliated third party.","Under the USA Patriot Act, transactions over $5,000 require a Suspicious Activity Report (SAR) within 30 days."], quickTableEN:[["Representation","Believed true","Not guaranteed"],["Warranty","Absolutely true","Contract validity depends on it"],["Preferred","Better health/lifestyle","Lower premium than Standard"],["Substandard","High risk","Rate-up, amendment, or counteroffer"]], examTrapEN:"Insurable interest is required at inception (application/issue), not at claim time — and it's the insured, not the beneficiary, who must have insurable interest." },
  { id:"salud-general", unit:"Seguro de Salud", title:"Tipos de Seguro de Salud", titleEN:"Types of Health Insurance", icon:"🏨", color:"from-pink-500 to-red-400", summary:"HMO, PPO, POS, cuentas de ahorro para salud, Cuidado a Largo Plazo, COBRA y planes de beneficio limitado.", keyPoints:["HMO (Health Maintenance Organization): plan de cuidado administrado con médico de cabecera (PCP) obligatorio y referido para especialistas (concepto 'gatekeeper'); opera en áreas geográficas específicas y paga a los médicos sobre una base capitada (prepagada).","PPO (Preferred Provider Organization): el miembro puede ver a cualquier médico dentro de la red sin referido; salir de la red reduce los beneficios; los médicos cobran por servicio prestado.","POS (Point of Service): combina HMO y PPO — dentro de la red funciona como HMO (base capitada, requiere PCP), fuera de la red funciona como PPO (mayor coseguro, sin referido).","FSA (Flexible Spending Account): parte de un plan de cafetería, dólares antes de impuestos; aplica la regla 'úsalo o piérdelo' (no se transfiere al año siguiente).","HRA (Health Reimbursement Account): fondos solo del empleador; se queda con el empleador original si el empleado se va.","HSA (Health Savings Account): fondos del empleador y del empleado; usarlos para algo que no sea salud antes de los 65 implica pagar impuesto sobre la renta más una multa del 20%; después de los 65 solo se paga impuesto sobre la renta.","COBRA: empleadores con 20+ empleados deben extender la cobertura grupal a empleados terminados y sus familias — 18 meses en general, 36 meses por muerte del empleado, divorcio o separación legal.","Cuidado a Largo Plazo (LTC): ayuda con actividades de la vida diaria; no puede excluir Alzheimer, demencia o Parkinson; tiene elimination period y benefit period (mínimo 12 meses); beneficios libres de impuestos a menos que excedan el costo diario del cuidado.","Niveles de cuidado en LTC: Especializado (Skilled, solo personal médico en institución), Intermedio (personal médico en institución o en casa), Custodial (puede ser personal no médico), en Casa (Home Health Care), Diurno para Adultos (Adult Day Care, menos de 24 horas), y de Relevo (Respite Care, para descansar al cuidador familiar).","Planes de Beneficio Limitado: Enfermedad Temida (cáncer o cardíaco), Enfermedad Crítica (paga por diagnóstico y supervivencia), Indemnización Hospitalaria, Médico a Corto Plazo (hasta 11 meses), y Solo Accidentes.","Discapacidad Presuntiva: ciertas condiciones (cuadriplejia, ceguera o sordera permanente, pérdida de 2 extremidades) califican automáticamente para el beneficio total por discapacidad.","Coordinación de Beneficios (Coordination of Benefits): provisión opcional que indica cuál póliza es primaria y cuál es excedente cuando el asegurado tiene más de una póliza grupal."], quickTable:[["HMO","PCP obligatorio + referido","Menor costo, red limitada"],["PPO","Sin referido, dentro o fuera de red","Mayor flexibilidad, más costo fuera de red"],["HSA","Empleador + empleado","Penalidad 20% si se usa mal antes de los 65"],["COBRA","20+ empleados","18 meses (36 por muerte/divorcio)"]], examTrap:"HRA es solo del empleador y se queda con el empleador si el empleado se va; HSA es de ambos (empleador y empleado) y el empleado se lo lleva consigo.", summaryEN:"HMO, PPO, POS, health savings accounts, Long-Term Care, COBRA, and limited benefit plans.", keyPointsEN:["HMO (Health Maintenance Organization): managed care plan with a mandatory primary care physician (PCP) and referrals required for specialists (the 'gatekeeper' concept); operates in specific geographic areas and pays doctors on a capitated (prepaid) basis.","PPO (Preferred Provider Organization): the member can see any doctor within the network without a referral; going outside the network reduces benefits; doctors are paid a fee for service.","POS (Point of Service): combines HMO and PPO — in-network works like an HMO (capitated basis, requires a PCP), out-of-network works like a PPO (higher coinsurance, no referral).","FSA (Flexible Spending Account): part of a cafeteria plan, pretax dollars; the 'use it or lose it' rule applies (funds don't carry over to next year).","HRA (Health Reimbursement Account): employer funds only; stays with the originating employer if the employee leaves.","HSA (Health Savings Account): funds from both employer and employee; using them for anything other than a healthcare expense before age 65 means paying ordinary income tax plus a 20% penalty; after 65, only income tax applies.","COBRA: employers with 20+ employees must extend group coverage to terminated employees and their families — 18 months generally, 36 months for the employee's death, divorce, or legal separation.","Long-Term Care (LTC): helps with activities of daily living; cannot exclude Alzheimer's, dementia, or Parkinson's; has an elimination period and a benefit period (minimum 12 months); benefits are tax-free unless they exceed the daily cost of care.","Levels of LTC care: Skilled (medical personnel only, institutional setting), Intermediate (medical personnel, institutional or home setting), Custodial (can be non-medical personnel), Home Health Care, Adult Day Care (less than 24 hours), and Respite Care (relief for a family caregiver).","Limited Benefit Plans: Dread Disease (cancer or heart), Critical Illness (pays on diagnosis and survival), Hospital Indemnity, Short Term Medical (up to 11 months), and Accident Only.","Presumptive Disability: certain conditions (quadriplegia, permanent blindness or deafness, loss of 2 limbs) automatically qualify for full disability benefits.","Coordination of Benefits: an optional provision stating which policy is primary and which is excess when the insured has more than one group policy."], quickTableEN:[["HMO","Mandatory PCP + referral","Lower cost, limited network"],["PPO","No referral, in or out of network","More flexibility, more cost out of network"],["HSA","Employer + employee","20% penalty if misused before 65"],["COBRA","20+ employees","18 months (36 for death/divorce)"]], examTrapEN:"An HRA is employer-funded only and stays with the employer if the employee leaves; an HSA is funded by both (employer and employee) and the employee takes it with them." },
];

  { titulo:"Preguntas de Práctica", nota:"Usa el mock exam y quizzes por unidad de la guía principal para medir preparación.", icono:"📝" },
];

function StatCard({ value, label }) {
  return <div className="rounded-2xl bg-white/15 p-4 backdrop-blur-sm"><div className="text-3xl font-bold">{value}</div><div className="text-sm opacity-90">{label}</div></div>;
}

function MiniQuiz({ pregunta, respuestaSeleccionada, setRespuestaSeleccionada, t }) {
  return (
    <div className="rounded-3xl border border-slate-200 bg-slate-50 p-5">
      <h3 className="mb-3 text-xl font-bold">{t("Mini Examen","Mini Quiz")}</h3>
      <p className="mb-4 font-semibold text-slate-800">{pregunta.question}</p>
      <div className="grid gap-3 md:grid-cols-2">
        {pregunta.choices.map((choice) => {
          const selected = respuestaSeleccionada === choice;
          const correct = choice === pregunta.answer;
          return <button key={choice} type="button" onClick={() => setRespuestaSeleccionada(choice)} className={cx("rounded-2xl border p-4 text-left font-semibold transition-all", !respuestaSeleccionada && "border-slate-200 bg-white hover:bg-blue-50", respuestaSeleccionada && correct && "border-green-300 bg-green-50 text-green-800", respuestaSeleccionada && selected && !correct && "border-red-300 bg-red-50 text-red-800", respuestaSeleccionada && !selected && !correct && "border-slate-200 bg-white opacity-70")}>{choice}</button>;
        })}
      </div>
      {respuestaSeleccionada && <div className="mt-4 rounded-2xl bg-white p-4"><p className="font-bold text-slate-800">{respuestaSeleccionada === pregunta.answer ? t("Correcto 🎉","Correct 🎉") : t("No exactamente — repasa esta.","Not quite — review this one.")}</p><p className="mt-2 text-slate-700">{pregunta.explanation}</p><button type="button" onClick={() => setRespuestaSeleccionada("")} className="mt-4 rounded-xl bg-slate-900 px-4 py-2 font-semibold text-white">{t("Intentar de nuevo","Try again")}</button></div>}
    </div>
  );
}

function SupervivenciaView({ lecciones, leccionActiva, leccionActivaId, elegirLeccion, preguntaLeccion, respuestaLeccion, setRespuestaLeccion }) {

              <div className="flex items-center gap-3"><span className="text-2xl">{leccion.icon}</span><span className="font-bold text-slate-800">{leccion.title}</span></div>

          <div className="flex items-center gap-3"><span className="text-5xl">{leccionActiva.icon}</span><div><h2 className="text-3xl font-bold">{leccionActiva.title}</h2><p className="mt-2 text-white/90">{leccionActiva.summary}</p></div></div>

        {unidades.map((unidad) => {
          const leccion = lecciones.find((l) => l.unit === unidad);

              <p className="mb-4 text-slate-600">{leccion?.summary}</p>

                <button type="button" onClick={() => { setFiltroExamen(unidad); resetExamen(); setModoActivo("mock-exam"); }} className="rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white hover:bg-blue-700">Unit Quiz</button>

}

function RepasoRapidoView({ cramCards, cramActual, cramIndex, mostrarCram, setMostrarCram, siguienteCram, anteriorCram, t }) {
  return (
    <section className="grid gap-6 lg:grid-cols-2">
      <div className="rounded-3xl bg-white p-6 shadow-lg"><div className="mb-6 flex items-center justify-between gap-4"><h2 className="text-2xl font-bold">{t("Tarjetas de Repaso Rápido","Cram Flashcards")}</h2><span className="rounded-full bg-slate-100 px-3 py-1 text-sm font-semibold text-slate-600">{cramIndex + 1} / {cramCards.length}</span></div><div className="rounded-3xl border border-slate-200 bg-slate-50 p-8 text-center"><p className="text-sm font-semibold uppercase tracking-wider text-slate-500">{t("Concepto","Concept")}</p><h3 className="mt-2 text-3xl font-bold text-slate-800">{cramActual[0]}</h3>{mostrarCram ? <p className="mt-6 rounded-2xl bg-green-50 p-5 text-lg font-semibold text-green-800">{cramActual[1]}</p> : <button type="button" onClick={() => setMostrarCram(true)} className="mt-6 rounded-2xl bg-green-600 px-5 py-3 font-semibold text-white">{t("Ver Respuesta","Reveal Answer")}</button>}</div><div className="mt-4 flex gap-3"><button type="button" onClick={anteriorCram} className="rounded-2xl bg-slate-100 px-4 py-3 font-semibold text-slate-700 hover:bg-slate-200">{t("Anterior","Previous")}</button><button type="button" onClick={siguienteCram} className="rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white hover:bg-blue-700">{t("Siguiente","Next")}</button></div></div>
      <div className="rounded-3xl bg-white p-6 shadow-lg"><h2 className="mb-6 text-2xl font-bold">{t("Repaso de Último Momento","Night Before Review")}</h2><div className="space-y-3">{cramCards.map(([term, definition]) => <div key={term} className="rounded-2xl bg-slate-100 p-4"><p className="font-bold text-slate-800">{term}</p><p className="mt-1 text-slate-600">{definition}</p></div>)}</div></div>
    </section>
  );
}

function MockExamView({ unidadesExamen, filtroExamen, setFiltroExamen, resetExamen, examenIniciado, setExamenIniciado, mostrarResultados, poolPreguntas, preguntaActual, preguntaExamen, respuestaExamen, setRespuestaExamen, enviarRespuestaExamen, score, respuestasExamen, t }) {
  return (
    <section className="rounded-3xl bg-white p-8 shadow-lg">
      <div className="mb-6 flex flex-wrap items-center justify-between gap-4"><div><h2 className="text-3xl font-bold">{t("Examen de Práctica","Mock Practice Exam")}</h2><p className="mt-2 text-slate-600">{t("Elige una unidad o toma un examen mixto completo.","Choose a unit or take a full mixed mock exam.")}</p></div><div className="rounded-2xl bg-blue-100 px-4 py-2 font-semibold text-blue-700">{poolPreguntas.length} {t("Preguntas","Questions")}</div></div>
      {!examenIniciado && !mostrarResultados && <div className="rounded-3xl bg-slate-50 p-8 text-center border border-slate-200"><h3 className="mb-4 text-2xl font-bold text-slate-800">{t("Elige el Tipo de Práctica","Choose Practice Type")}</h3><select value={filtroExamen} onChange={(e) => { setFiltroExamen(e.target.value); resetExamen(); }} className="mb-6 w-full max-w-xl rounded-2xl border border-slate-300 bg-white px-5 py-4 text-lg outline-none focus:border-blue-400">{unidadesExamen.map((u) => <option key={u}>{u}</option>)}</select><br /><button type="button" onClick={() => setExamenIniciado(true)} className="rounded-2xl bg-blue-600 px-6 py-4 text-lg font-semibold text-white hover:bg-blue-700">{t("Iniciar Examen de Práctica","Start Practice Exam")}</button></div>}
      {examenIniciado && !mostrarResultados && <div className="space-y-6"><div className="flex items-center justify-between flex-wrap gap-3"><div className="text-sm font-semibold uppercase tracking-wider text-slate-500">{t("Pregunta","Question")} {preguntaActual + 1} {t("de","of")} {poolPreguntas.length}</div><div className="rounded-full bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700">{t("Puntaje","Score")}: {score}</div></div><div className="w-full rounded-full bg-slate-200 h-4 overflow-hidden"><div className="h-full bg-gradient-to-r from-blue-500 to-cyan-400 transition-all" style={{ width:`${((preguntaActual+1)/poolPreguntas.length)*100}%` }} /></div><div className="rounded-3xl border border-slate-200 bg-slate-50 p-8"><div className="mb-3 rounded-full bg-indigo-100 px-3 py-2 text-sm font-semibold text-indigo-700 inline-flex">{preguntaExamen.unit}</div><h3 className="mb-6 text-2xl font-bold text-slate-800">{preguntaExamen.question}</h3><div className="grid gap-4 md:grid-cols-2">{preguntaExamen.choices.map((choice) => <button key={choice} type="button" onClick={() => setRespuestaExamen(choice)} className={cx("rounded-2xl border p-5 text-left font-semibold transition-all", respuestaExamen === choice ? "border-blue-400 bg-blue-50 text-blue-800" : "border-slate-200 bg-white hover:bg-slate-100")}>{choice}</button>)}</div><button type="button" onClick={enviarRespuestaExamen} disabled={!respuestaExamen} className="mt-6 rounded-2xl bg-emerald-600 px-6 py-4 font-semibold text-white hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed">{t("Enviar Respuesta","Submit Answer")}</button></div></div>}
      {mostrarResultados && <div className="rounded-3xl bg-slate-50 border border-slate-200 p-8 text-center"><h3 className="mb-4 text-3xl font-bold text-slate-800">{t("Examen Completado","Exam Complete")}</h3><div className="mb-4 text-6xl font-bold text-blue-700">{Math.round((score/poolPreguntas.length)*100)}%</div><p className="mb-8 text-lg text-slate-600">{score} {t("de","of")} {poolPreguntas.length} {t("correctas.","correct.")}</p><button type="button" onClick={resetExamen} className="mb-8 rounded-2xl bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700">{t("Repetir / Elegir Otra Unidad","Retake / Choose Another Unit")}</button><div className="grid gap-4 text-left max-w-4xl mx-auto">{respuestasExamen.map((a, i) => <div key={i} className={cx("rounded-2xl p-5 border", a.isCorrect ? "bg-green-50 border-green-200" : "bg-red-50 border-red-200")}><p className="mb-1 text-sm font-bold text-slate-500">{a.unit}</p><p className="font-bold mb-2">{a.question}</p><p>{t("Tu Respuesta","Your Answer")}: {a.selected}</p><p>{t("Correcta","Correct")}: {a.correct}</p></div>)}</div></div>}
    </section>
  );
}

function PlataformaTexasLifeHealthEspanolEspejo() {
  const TAB_INICIO = 0;
  const TAB_REPASO = lecciones.length + 1;
  const TAB_MOCK   = lecciones.length + 2;

  const t = (es, en) => window._libLang === 'es' ? es : en;

  const consejos = [
    t("Enfócate en entender conceptos, no solo memorizar definiciones.", "Focus on understanding concepts, not just memorizing definitions."),
    t("Practica comparar pólizas y provisiones similares lado a lado.", "Practice comparing similar policies and provisions side by side."),
    t("Disability y Medicare suelen ser áreas donde más se falla — repásalas varias veces.", "Disability and Medicare are the most-failed areas — review them multiple times."),
    t("Usa el Mock Exam la noche antes del examen para medir tu nivel.", "Use the Mock Exam the night before your test to gauge your readiness."),
  ];

  const tourSteps = [
    { tab: TAB_INICIO, label: t("Inicio","Home"), desc: t("Tu pantalla de bienvenida con consejos prácticos y el botón de primeros pasos.","Your welcome screen with practical tips and the first-steps button.") },
    ...lecciones.map((l, i) => ({ tab: i + 1, label: t(l.title, l.titleEN), desc: l.summary })),
    { tab: TAB_REPASO, label: t("Repaso Rápido","Quick Review"), desc: t("Cram cards y Night Before Review para repasar antes del examen.","Cram cards and Night Before Review to recap before your exam.") },
    { tab: TAB_MOCK,   label: "Mock Exam", desc: t("Practica con preguntas de todas las unidades y revisa tu score al finalizar.","Practice with questions from all units and review your score when done.") },
  ];

  const [showConsejos, setShowConsejos] = useState(() => !sessionStorage.getItem('tlh_consejos_shown'));
  const [tabActivo, setTabActivo]       = useState(TAB_INICIO);
  const [tourStep, setTourStep]         = useState(null);
  const [respuestaLeccion, setRespuestaLeccion] = useState("");
  const [examenIniciado, setExamenIniciado]     = useState(false);
  const [preguntaActual, setPreguntaActual]     = useState(0);
  const [respuestaExamen, setRespuestaExamen]   = useState("");
  const [respuestasExamen, setRespuestasExamen] = useState([]);
  const [mostrarResultados, setMostrarResultados] = useState(false);
  const [filtroExamen, setFiltroExamen] = useState("Todas las Unidades");
  const [cramIndex, setCramIndex]   = useState(0);
  const [mostrarCram, setMostrarCram] = useState(false);

  const isLeccion   = tabActivo >= 1 && tabActivo <= lecciones.length;
  const leccionActiva = lecciones[tabActivo - 1] || lecciones[0];
  const unitEN = { "Fundamentos del Seguro":"Insurance Fundamentals", "Tipos de Pólizas de Vida":"Life Insurance Policy Types", "Riders":"Riders", "Provisiones de Póliza":"Policy Provisions", "Opciones de Póliza":"Policy Options", "Disability Income":"Disability Income", "Medicare y Medicaid":"Medicare and Medicaid", "Underwriting y Ley de Texas":"Underwriting and Texas Law" };
  const preguntasMockActual = window._libLang === 'es' ? preguntasMock : preguntasMockEN;
  const unidadTodas = t("Todas las Unidades","All Units");
  const unitES = useMemo(() => { const rev = {}; Object.keys(unitEN).forEach((es) => { rev[unitEN[es]] = es; }); return rev; }, []);
  // filtroExamen stores whatever language's unit label was selected in the
  // dropdown. On a language toggle it goes stale (e.g. still the Spanish
  // name while everything else is now English), and preguntasMockActual
  // filters against it and comes back empty, so preguntaExamen becomes
  // undefined and the exam view crashes to a blank screen. Always resolve
  // it to the current language's equivalent before using it.
  const filtroExamenActual = useMemo(() => {
    if (filtroExamen === unidadTodas || filtroExamen === "Todas las Unidades" || filtroExamen === "All Units") return unidadTodas;
    return window._libLang === 'es' ? (unitES[filtroExamen] || filtroExamen) : (unitEN[filtroExamen] || filtroExamen);
  }, [filtroExamen, window._libLang]);
  const preguntaLeccion = useMemo(() => {
    const currentUnitEs = (lecciones[tabActivo - 1] || lecciones[0]).unit;
    const currentUnit = window._libLang === 'es' ? currentUnitEs : (unitEN[currentUnitEs] || currentUnitEs);
    return preguntasMockActual.find((p) => p.unit === currentUnit) || preguntasMockActual[0];
  }, [tabActivo, window._libLang]);
  const cramCardsActual = window._libLang === 'es' ? cramCards : cramCardsEN;
  const cramActual  = cramCardsActual[cramIndex];
  const unidadesExamen = [unidadTodas, ...Array.from(new Set(preguntasMockActual.map((p) => p.unit)))];
  const poolPreguntas  = useMemo(() => filtroExamenActual === unidadTodas ? preguntasMockActual : preguntasMockActual.filter((p) => p.unit === filtroExamenActual), [filtroExamenActual, unidadTodas, window._libLang]);
  const preguntaExamen = poolPreguntas[preguntaActual] || poolPreguntas[0];
  const score = respuestasExamen.filter((r) => r.isCorrect).length;

  const resetExamen = () => { setExamenIniciado(false); setPreguntaActual(0); setRespuestaExamen(""); setRespuestasExamen([]); setMostrarResultados(false); };
  const enviarRespuestaExamen = () => {
    if (!respuestaExamen) return;
    const nuevas = [...respuestasExamen, { unit: preguntaExamen.unit, question: preguntaExamen.question, selected: respuestaExamen, correct: preguntaExamen.answer, isCorrect: respuestaExamen === preguntaExamen.answer }];
    setRespuestasExamen(nuevas);
    setRespuestaExamen("");
    if (preguntaActual + 1 >= poolPreguntas.length) setMostrarResultados(true);
    else setPreguntaActual(preguntaActual + 1);
  };
  const siguienteCram = () => { setMostrarCram(false); setCramIndex((i) => (i + 1) % cramCardsActual.length); };
  const anteriorCram  = () => { setMostrarCram(false); setCramIndex((i) => (i - 1 + cramCardsActual.length) % cramCardsActual.length); };

  const startTour = () => { sessionStorage.setItem('tlh_consejos_shown','1'); setShowConsejos(false); setTourStep(0); setTabActivo(tourSteps[0].tab); };
  const tourNext  = () => {
    if (tourStep + 1 < tourSteps.length) { const n = tourStep + 1; setTourStep(n); setTabActivo(tourSteps[n].tab); }
    else endTour();
  };
  const endTour = () => { setTourStep(null); setTabActivo(TAB_INICIO); localStorage.setItem('tlh_tour_done','1'); };

  const handleEntendido = () => {
    sessionStorage.setItem('tlh_consejos_shown','1');
    if (!localStorage.getItem('tlh_tour_done')) startTour();
    else setShowConsejos(false);
  };

  const tourHighlight = (idx) => tourStep !== null && tourSteps[tourStep].tab === idx ? "tlh-tab-highlighted" : "";

  return (
    <main className="min-h-screen bg-slate-100 p-6 text-slate-900">

      {showConsejos && (
        <div className="tlh-modal-backdrop" onClick={() => { sessionStorage.setItem('tlh_consejos_shown','1'); setShowConsejos(false); }}>
          <div className="tlh-modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="tlh-modal-badge">Academia Ensurity</div>
            <h2 className="tlh-modal-title">{t("Consejos Prácticos","Practical Tips")}</h2>
            <p className="tlh-modal-sub">{t("Antes de comenzar, ten esto en mente","Before starting, keep these in mind")}</p>
            {consejos.map((c, i) => (
              <div key={i} className="tlh-consejo-item" style={{ animation:`tlh-item-in .35s ease ${.18 + i * .09}s forwards` }}>
                <span className="tlh-consejo-num">0{i + 1}</span>
                <p className="tlh-consejo-text">{c}</p>
              </div>
            ))}
            <button className="tlh-modal-btn" onClick={handleEntendido}>{t("Entendido, comenzar","Got it, let's start")}</button>
          </div>
        </div>
      )}

      {tourStep !== null && <div className="tlh-tour-overlay" />}

      {tourStep !== null && (
        <div className="tlh-tour-card">
          <div className="tlh-tour-dots">
            {tourSteps.map((_, i) => <div key={i} className={cx("tlh-tour-dot", tourStep === i ? "active" : "")} />)}
          </div>
          <p className="text-xs font-bold uppercase tracking-wider text-blue-500 mb-1">{tourStep + 1} / {tourSteps.length} — {tourSteps[tourStep].label}</p>
          <p className="text-sm text-slate-700 leading-relaxed mb-4">{tourSteps[tourStep].desc}</p>
          <div className="flex gap-2 items-center">
            <button type="button" onClick={endTour} className="text-sm text-slate-400 hover:text-slate-600 px-3 py-2 rounded-xl hover:bg-slate-100 transition-all">{t("Omitir tour","Skip tour")}</button>
            <button type="button" onClick={tourNext} className="flex-1 rounded-xl bg-blue-600 text-white font-semibold text-sm py-2 hover:bg-blue-700 transition-all">
              {tourStep + 1 < tourSteps.length ? t("Siguiente →","Next →") : t("Finalizar tour","Finish tour")}
            </button>
          </div>
        </div>
      )}

      <div className="mx-auto max-w-7xl space-y-6">

        <div className="flex flex-wrap gap-2" style={{ position:'relative', zIndex: tourStep !== null ? 160 : 'auto' }}>
          <button type="button" onClick={() => setTabActivo(TAB_INICIO)}
            className={cx("rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap transition-all border",
              tabActivo === TAB_INICIO ? "bg-blue-600 text-white border-blue-600 shadow" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50",
              tourHighlight(TAB_INICIO))}>
            {t("Inicio","Home")}
          </button>
          {lecciones.map((l, i) => (
            <button key={l.id} type="button" onClick={() => { setTabActivo(i + 1); setRespuestaLeccion(""); }}
              className={cx("rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap transition-all border",
                tabActivo === i + 1 ? "bg-blue-600 text-white border-blue-600 shadow" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50",
                tourHighlight(i + 1))}>
              {t(l.title, l.titleEN)}
            </button>

            <div className="flex gap-2">
              <button type="button" onClick={endTour} className="text-sm text-slate-400 hover:text-slate-600 px-3 py-2 rounded-xl hover:bg-slate-100 transition-all">Omitir</button>
              <button type="button" onClick={tourNext} className="flex-1 rounded-xl bg-blue-600 text-white font-semibold text-sm py-2 hover:bg-blue-700 transition-all">{tourStep + 1 < tourSteps.length ? "Siguiente →" : "Finalizar"}</button>
            </div>
          </div>
        )}

        {tabActivo === TAB_INICIO && (
          <div className="space-y-6">
            <div className="rounded-3xl bg-gradient-to-r from-slate-800 to-blue-900 p-8 text-white shadow-xl">
              <p className="text-sm font-semibold uppercase tracking-wider text-white/70 mb-2">Texas Life &amp; Health</p>
              <h2 className="text-3xl font-bold mb-2">Biblioteca Avanzada</h2>
              <p className="text-white/85 max-w-xl mb-6">Explicaciones profundas, trampas del examen, hojas de memoria y recursos — organizados por capítulo.</p>
              <button type="button" onClick={startTour} className="rounded-2xl bg-white/15 border border-white/30 px-5 py-3 font-semibold text-white hover:bg-white/25 transition-all">Explorar Capítulos →</button>
            </div>
            <div className="rounded-3xl bg-white border border-slate-200 p-8 shadow-lg">
              <h3 className="text-xl font-bold text-slate-800 mb-5">Consejos de Estudio</h3>
              <div className="grid gap-4 md:grid-cols-2">
                {[
                  "Comienza con el capítulo que estás estudiando en clase.",
                  "Usa el buscador para encontrar rápidamente cualquier concepto o término.",
                  "Las Hojas de Memoria son perfectas para repasar la noche antes del examen.",
                  "Presta atención a la Trampa del Examen en cada tarjeta — son los puntos más evaluados.",
                ].map((tip, i) => (
                  <div key={i} className="flex gap-3 rounded-2xl bg-slate-50 border border-slate-100 p-4">
                    <span className="text-xs font-bold text-blue-600 bg-blue-100 rounded-lg px-2 py-1 h-fit shrink-0 mt-0.5">0{i + 1}</span>
                    <p className="text-sm text-slate-700 leading-relaxed">{tip}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {esCapitulo && (
          <>
            <div className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
              <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar: beneficiario, Parte D, elimination period..." className="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100" />
              <p className="mt-2 text-xs text-slate-400">{tarjetasFiltradas.length} tarjetas</p>
            </div>
            <div className="grid gap-4 md:grid-cols-2">
              {tarjetasFiltradas.map((t) => (
                <button key={`${t.capituloId}-${t.titulo}`} type="button" onClick={() => setTarjetaSeleccionada(t)} className={cx("rounded-3xl border bg-white p-6 text-left shadow-md transition-all hover:-translate-y-1 hover:shadow-xl", tarjetaSeleccionada.titulo === t.titulo ? "border-blue-400 ring-2 ring-blue-100" : "border-slate-200")}>
                  <h3 className="font-bold text-slate-800 mb-1">{t.titulo}</h3>
                  <p className="text-xs font-semibold text-slate-400 mb-3">{t.capituloTitulo}</p>
                  <p className="text-sm leading-relaxed text-slate-600 line-clamp-3">{t.contenido}</p>
                </button>
              ))}
            </div>
            <article className="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-lg">
              <div className={cx("bg-gradient-to-r p-6 text-white", tarjetaSeleccionada.capituloColor)}>
                <h2 className="text-2xl font-bold">{tarjetaSeleccionada.titulo}</h2>
                <p className="mt-1 text-sm text-white/80">{tarjetaSeleccionada.capituloTitulo}</p>
              </div>
              <div className="space-y-5 p-6">
                <div><h3 className="mb-2 text-lg font-bold">Explicación</h3><p className="leading-relaxed text-slate-700">{tarjetaSeleccionada.contenido}</p></div>
                <div className="rounded-2xl border border-red-100 bg-red-50 p-5"><h3 className="mb-2 text-lg font-bold text-red-700">Trampa del Examen</h3><p className="text-slate-700">{tarjetaSeleccionada.trampa}</p></div>
              </div>
            </article>
          </>
        )}

        {tabActivo === TAB_MEMORIA && (
          <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
            <h2 className="mb-5 text-2xl font-bold text-slate-800">Hojas de Memoria</h2>
            <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
              {hojasMemoria.map((hoja) => <div key={hoja.titulo} className="rounded-2xl border border-slate-200 bg-slate-50 p-5"><h3 className="mb-4 text-lg font-bold text-slate-800">{hoja.titulo}</h3><div className="space-y-2">{hoja.puntos.map((p) => <div key={p} className="rounded-xl bg-white border border-slate-100 p-3 text-sm font-medium text-slate-700">{p}</div>)}</div></div>)}
            </div>
          </section>
        )}

        {tabActivo === TAB_RECURSOS && (
          <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
            <h2 className="mb-5 text-2xl font-bold text-slate-800">Recursos</h2>
            <div className="grid gap-4 md:grid-cols-2">
              {recursos.map((r) => <div key={r.titulo} className="rounded-2xl border border-slate-200 bg-slate-50 p-5"><h3 className="mb-2 text-lg font-bold text-slate-800">{r.titulo}</h3><p className="text-sm leading-relaxed text-slate-600">{r.nota}</p></div>)}
            </div>
          </section>
        )}

      </div>
    </main>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// TABS ROUTER — single root, swap component on tab change
// ════════════════════════════════════════════════════════════════════════════
let _singleRoot = null;

window.renderActiveTab = function() {
  const idx = window._activeTab || 0;
  const el = document.getElementById('react-root');
  if (!_singleRoot) {
    _singleRoot = ReactDOM.createRoot(el);
  }
  let Comp;
  if (idx === 0) {
    Comp = PlataformaTexasLifeHealthEspanolEspejo;
  } else {
    Comp = window._libLang === 'es' ? BibliotecaAvanzadaTexasLifeHealth : TexasLifeHealthDeepDiveLibrary;
  }
  _singleRoot.render(<Comp />);
};
</script>
</body>
</html>
