<script>
// Auth gate — show app only after verifying session
let _activeTab = 0;

function setTab(idx) {
  _activeTab = idx;
  document.querySelectorAll('.tlh-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  renderActiveTab();
}

async function boot() {
  document.getElementById('auth-gate').style.display = 'flex';
  const waitAZ = () => new Promise(r => { const t = setInterval(() => { if (window.AZ) { clearInterval(t); r(); } }, 80); });
  await waitAZ();
  const user = await window.AZ.Auth.getCurrentUser();
  if (!user) { window.location.href = '/'; return; }
  document.getElementById('auth-gate').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';
  renderActiveTab();
}
boot();
</script>

function StatCard({ value, label }) {
  return <div className="rounded-2xl bg-white/15 p-4 backdrop-blur-sm"><div className="text-3xl font-bold">{value}</div><div className="text-sm opacity-90">{label}</div></div>;
}

function MiniQuiz({ pregunta, respuestaSeleccionada, setRespuestaSeleccionada }) {
  return (
    <div className="rounded-3xl border border-slate-200 bg-slate-50 p-5">
      <h3 className="mb-3 text-xl font-bold">Mini Quiz</h3>
      <p className="mb-4 font-semibold text-slate-800">{pregunta.question}</p>
      <div className="grid gap-3 md:grid-cols-2">
        {pregunta.choices.map((choice) => {
          const selected = respuestaSeleccionada === choice;
          const correct = choice === pregunta.answer;
          return <button key={choice} type="button" onClick={() => setRespuestaSeleccionada(choice)} className={cx("rounded-2xl border p-4 text-left font-semibold transition-all", !respuestaSeleccionada && "border-slate-200 bg-white hover:bg-blue-50", respuestaSeleccionada && correct && "border-green-300 bg-green-50 text-green-800", respuestaSeleccionada && selected && !correct && "border-red-300 bg-red-50 text-red-800", respuestaSeleccionada && !selected && !correct && "border-slate-200 bg-white opacity-70")}>{choice}</button>;
        })}
      </div>
      {respuestaSeleccionada && <div className="mt-4 rounded-2xl bg-white p-4"><p className="font-bold text-slate-800">{respuestaSeleccionada === pregunta.answer ? "Correcto 🎉" : "No exactamente — repasa esta."}</p><p className="mt-2 text-slate-700">{pregunta.explanation}</p><button type="button" onClick={() => setRespuestaSeleccionada("")} className="mt-4 rounded-xl bg-slate-900 px-4 py-2 font-semibold text-white">Intentar de nuevo</button></div>}
    </div>
  );
}

function PlataformaTexasLifeHealthEspanolEspejo() {
  const [modoActivo, setModoActivo] = useState("supervivencia");
  const [leccionActivaId, setLeccionActivaId] = useState("basicos-vida");
  const [respuestaLeccion, setRespuestaLeccion] = useState("");
  const [examenIniciado, setExamenIniciado] = useState(false);
  const [preguntaActual, setPreguntaActual] = useState(0);
  const [respuestaExamen, setRespuestaExamen] = useState("");
  const [respuestasExamen, setRespuestasExamen] = useState([]);
  const [mostrarResultados, setMostrarResultados] = useState(false);
  const [filtroExamen, setFiltroExamen] = useState("Todas las Unidades");
  const [cramIndex, setCramIndex] = useState(0);
  const [mostrarCram, setMostrarCram] = useState(false);

  const modoActivoData = modosEstudio.find((m) => m.id === modoActivo) || modosEstudio[0];
  const leccionActiva = lecciones.find((l) => l.id === leccionActivaId) || lecciones[0];
  const unidadesExamen = ["Todas las Unidades", ...Array.from(new Set(preguntasMock.map((p) => p.unit)))];
  const poolPreguntas = filtroExamen === "Todas las Unidades" ? preguntasMock : preguntasMock.filter((p) => p.unit === filtroExamen);
  const preguntaExamen = poolPreguntas[preguntaActual] || poolPreguntas[0];
  const preguntaLeccion = preguntasMock.find((p) => p.unit === leccionActiva.unit) || preguntasMock[0];
  const cramActual = cramCards[cramIndex];
  const checksListos = useMemo(() => revisionesPlataforma.filter((r) => r.passed).length, []);
  const score = respuestasExamen.filter((r) => r.isCorrect).length;

  const resetExamen = () => { setExamenIniciado(false); setPreguntaActual(0); setRespuestaExamen(""); setRespuestasExamen([]); setMostrarResultados(false); };
  const elegirLeccion = (id) => { setLeccionActivaId(id); setRespuestaLeccion(""); };
  const enviarRespuestaExamen = () => {
    if (!respuestaExamen) return;
    const nuevas = [...respuestasExamen, { unit: preguntaExamen.unit, question: preguntaExamen.question, selected: respuestaExamen, correct: preguntaExamen.answer, isCorrect: respuestaExamen === preguntaExamen.answer }];
    setRespuestasExamen(nuevas);
    setRespuestaExamen("");
    if (preguntaActual + 1 >= poolPreguntas.length) setMostrarResultados(true);
    else setPreguntaActual(preguntaActual + 1);
  };
  const siguienteCram = () => { setMostrarCram(false); setCramIndex((i) => (i + 1) % cramCards.length); };
  const anteriorCram = () => { setMostrarCram(false); setCramIndex((i) => (i - 1 + cramCards.length) % cramCards.length); };

  return (
    <main className="min-h-screen bg-slate-100 p-6 text-slate-900">
      <div className="mx-auto max-w-7xl space-y-8">
        <section className="rounded-3xl bg-gradient-to-r from-blue-700 to-cyan-500 p-8 text-white shadow-xl">
          <h2 className="mb-3 text-4xl font-bold">Guía de Supervivencia Texas Life & Health</h2>
          <p className="max-w-3xl text-lg opacity-90">Sistema interactivo con explicaciones high-yield, lecciones por unidad, exam traps y preguntas de práctica.</p>
          <div className="mt-8 grid gap-4 md:grid-cols-4">
            <StatCard value={lecciones.length} label="Unidades" />
            <StatCard value={preguntasMock.length} label="Mock Questions" />
            <StatCard value={cramCards.length} label="Cram Cards" />
            <StatCard value="TX" label="Texas Specific" />
          </div>
        </section>

        <section className="rounded-3xl bg-white p-8 shadow-lg border border-slate-200">
          <h2 className="mb-6 text-3xl font-bold text-slate-800">🚀 Quick Start Roadmap</h2>
          <div className="grid gap-5 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            {pasosRapidos.map((item) => (
              <div key={item.step} className="rounded-3xl bg-slate-50 border border-slate-200 p-6 hover:shadow-md transition-all">
                <div className="mb-4 inline-flex rounded-full bg-blue-100 px-3 py-1 text-sm font-bold text-blue-700">{item.step}</div>
                <h3 className="mb-3 text-lg font-bold text-slate-800">{item.title}</h3>
                <p className="leading-relaxed text-slate-600 text-sm">{item.description}</p>
              </div>
            ))}
          </div>
        </section>

        <section>
          <h2 className="mb-4 text-2xl font-bold">Modos de Estudio</h2>
          <div className="grid gap-5 md:grid-cols-2 lg:grid-cols-5">
            {modosEstudio.map((modo) => (
              <button key={modo.id} type="button" onClick={() => setModoActivo(modo.id)} className={cx("rounded-3xl border p-5 text-left shadow-lg transition-all hover:-translate-y-1 hover:shadow-2xl", modoActivo === modo.id ? "border-blue-400 bg-blue-50 ring-2 ring-blue-200" : "border-slate-200 bg-white")}>
                <div className="mb-3 text-4xl">{modo.icon}</div>
                <h3 className="mb-2 text-lg font-bold text-slate-800">{modo.title}</h3>
                <p className="text-sm leading-relaxed text-slate-600">{modo.description}</p>
              </button>
            ))}
          </div>
        </section>

        <section className="rounded-3xl border border-blue-100 bg-blue-50 p-5 shadow-sm">
          <p className="text-sm font-semibold uppercase tracking-wider text-blue-700">MODO ACTUAL</p>
          <h2 className="mt-1 text-2xl font-bold text-blue-950">{modoActivoData.icon} {modoActivoData.title}</h2>
          <p className="mt-1 text-blue-900">{modoActivoData.description}</p>
        </section>

        {modoActivo === "supervivencia" && <SupervivenciaView lecciones={lecciones} leccionActiva={leccionActiva} leccionActivaId={leccionActivaId} elegirLeccion={elegirLeccion} preguntaLeccion={preguntaLeccion} respuestaLeccion={respuestaLeccion} setRespuestaLeccion={setRespuestaLeccion} />}
        {modoActivo === "unidades" && <UnidadesView lecciones={lecciones} setModoActivo={setModoActivo} elegirLeccion={elegirLeccion} preguntasMock={preguntasMock} setFiltroExamen={setFiltroExamen} resetExamen={resetExamen} />}
        {modoActivo === "repaso-rapido" && <RepasoRapidoView cramCards={cramCards} cramActual={cramActual} cramIndex={cramIndex} mostrarCram={mostrarCram} setMostrarCram={setMostrarCram} siguienteCram={siguienteCram} anteriorCram={anteriorCram} />}
        {modoActivo === "mock-exam" && <MockExamView unidadesExamen={unidadesExamen} filtroExamen={filtroExamen} setFiltroExamen={setFiltroExamen} resetExamen={resetExamen} examenIniciado={examenIniciado} setExamenIniciado={setExamenIniciado} mostrarResultados={mostrarResultados} poolPreguntas={poolPreguntas} preguntaActual={preguntaActual} preguntaExamen={preguntaExamen} respuestaExamen={respuestaExamen} setRespuestaExamen={setRespuestaExamen} enviarRespuestaExamen={enviarRespuestaExamen} score={score} respuestasExamen={respuestasExamen} />}
        {modoActivo === "biblioteca" && (
          <section className="rounded-3xl bg-white p-8 shadow-lg">
            <h2 className="mb-4 text-2xl font-bold">📚 Biblioteca Avanzada</h2>
            <p className="mb-6 text-slate-600">Usa el tab "Biblioteca ES" arriba para acceder a la biblioteca completa en español.</p>
            <div className="grid gap-4 md:grid-cols-2">{deepDiveItemsES.map((item) => <div key={item} className="rounded-2xl bg-slate-100 p-5 font-medium text-slate-700">{item}</div>)}</div>
          </section>
        )}

        <section className="rounded-3xl bg-gradient-to-r from-slate-900 to-slate-800 p-8 text-white shadow-xl">
          <h2 className="mb-3 text-3xl font-bold">🎯 Consejos Finales</h2>
          <div className="space-y-2 text-slate-200 max-w-3xl">
            <p>• Enfócate en entender conceptos, no solo memorizar definiciones.</p>
            <p>• Practica comparar pólizas y provisiones similares lado a lado.</p>
            <p>• Disability y Medicare suelen ser áreas falladas — repásalas varias veces.</p>
            <p>• Usa Quick Pass Mode la noche antes del examen.</p>
          </div>
        </section>

        <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
          <h2 className="mb-4 text-2xl font-bold">Revisión Técnica</h2>
          <p className="mb-4 text-slate-600">{checksListos} de {revisionesPlataforma.length} checks listos.</p>
          <div className="grid gap-3 md:grid-cols-2">
            {revisionesPlataforma.map((test) => <div key={test.name} className="flex items-center justify-between rounded-2xl bg-slate-100 p-4"><span className="font-medium text-slate-700">{test.name}</span><span className={test.passed ? "font-bold text-green-700" : "font-bold text-red-700"}>{test.passed ? "Listo" : "Revisar"}</span></div>)}
          </div>
        </section>
      </div>
    </main>
  );
}

                {filteredCards.map((card) => (
                  <button key={`${card.chapterId}-${card.title}`} type="button" onClick={() => setSelectedCard(card)} className={cx("rounded-3xl border bg-white p-6 text-left shadow-md transition-all hover:-translate-y-1 hover:shadow-xl", selectedCard.title === card.title ? "border-blue-400 ring-2 ring-blue-100" : "border-slate-200")}>
                    <div className="mb-4 flex items-center gap-3"><div className={cx("flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-r text-2xl text-white", card.chapterColor)}>{card.chapterIcon}</div><div><h3 className="font-bold text-slate-800">{card.title}</h3><p className="text-sm text-slate-500">{card.chapterTitle}</p></div></div>
                    <p className="text-sm leading-relaxed text-slate-600">{card.content}</p>
                    <div className="mt-4 flex flex-wrap gap-2">{card.tags.map((tag) => <span key={tag} className="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">{tag}</span>)}</div>
                  </button>
                ))}
              </div>
            </section>
          </section>
        )}

        {activeTool === "chapters" && (
          <section className="grid gap-5 md:grid-cols-2 lg:grid-cols-3">
            {chapters.map((ch) => (
              <article key={ch.id} className="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-lg">
                <div className={cx("bg-gradient-to-r p-6 text-white", ch.color)}><div className="text-5xl">{ch.icon}</div><h2 className="mt-4 text-2xl font-bold">{ch.title}</h2><p className="mt-2 text-white/90">{ch.summary}</p></div>
                <div className="space-y-3 p-5">
                  {ch.cards.map((card) => (
                    <button key={card.title} type="button" onClick={() => { setSelectedCard({...card, chapterId:ch.id, chapterTitle:ch.title, chapterIcon:ch.icon, chapterColor:ch.color}); setActiveTool("library"); setActiveChapterId(ch.id); }} className="w-full rounded-2xl bg-slate-50 p-4 text-left font-semibold text-slate-700 transition-all hover:bg-blue-50">{card.title}</button>
                  ))}
                </div>
              </article>
            ))}
          </section>
        )}

        {activeTool === "memory" && (
          <section className="rounded-3xl border border-emerald-200 bg-emerald-50 p-6 shadow-lg">
            <h2 className="mb-2 text-3xl font-bold text-emerald-950">🧠 Memory Cheat Sheets</h2>
            <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
              {memorySheets.map((sheet) => <div key={sheet.title} className="rounded-3xl border border-emerald-200 bg-white p-6 shadow-sm"><h3 className="mb-4 text-xl font-bold text-slate-800">{sheet.title}</h3><div className="space-y-3">{sheet.bullets.map((b) => <div key={b} className="rounded-2xl bg-slate-50 p-3 font-medium text-slate-700">{b}</div>)}</div></div>)}
            </div>
          </section>
        )}

        {activeTool === "resources" && (
          <section className="rounded-3xl border border-purple-200 bg-purple-50 p-6 shadow-lg">
            <h2 className="mb-2 text-3xl font-bold text-purple-950">🔗 Extra Study Resources</h2>
            <div className="grid gap-4 md:grid-cols-2">
              {resources.map((r) => <div key={r.title} className="rounded-3xl border border-purple-200 bg-white p-6 shadow-sm"><div className="mb-4 flex items-center gap-4"><div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-purple-100 text-3xl">{r.icon}</div><h3 className="text-xl font-bold text-slate-800">{r.title}</h3></div><p className="leading-relaxed text-slate-600">{r.note}</p></div>)}
            </div>
          </section>
        )}

        <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
          <div className="mb-4 flex items-center justify-between gap-4"><div><p className="text-sm font-semibold uppercase tracking-wider text-slate-500">Selected Card</p><h2 className="mt-1 text-3xl font-bold text-slate-800">{selectedCard.title}</h2></div><div className="rounded-2xl bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-600">{selectedCard.chapterTitle || "Reference"}</div></div>
          <div className="grid gap-5 lg:grid-cols-3">
            <div className="rounded-3xl bg-slate-50 p-5 lg:col-span-2"><h3 className="mb-3 text-xl font-bold">Explanation</h3><p className="leading-relaxed text-slate-700">{selectedCard.content}</p></div>
            <div className="rounded-3xl border border-red-100 bg-red-50 p-5"><h3 className="mb-3 text-xl font-bold text-red-700">⚠️ Exam Trap</h3><p className="text-slate-700">{selectedCard.trap}</p></div>
            <div className="rounded-3xl border border-blue-100 bg-blue-50 p-5"><h3 className="mb-3 text-xl font-bold text-blue-800">Useful For</h3><p className="text-slate-700">{selectedCard.usefulFor}</p></div>
            <div className="rounded-3xl bg-slate-50 p-5 lg:col-span-2"><h3 className="mb-3 text-xl font-bold">Tags</h3><div className="flex flex-wrap gap-2">{selectedCard.tags.map((tag) => <span key={tag} className="rounded-full bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm">{tag}</span>)}</div></div>
          </div>
        </section>

        <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
          <h2 className="mb-4 text-2xl font-bold">Library Self-Checks</h2>
          <div className="grid gap-3 md:grid-cols-2">{selfChecks.map((t) => <div key={t.name} className="flex items-center justify-between rounded-2xl bg-slate-100 p-4"><span className="font-medium text-slate-700">{t.name}</span><span className={t.passed ? "font-bold text-green-700" : "font-bold text-red-700"}>{t.passed ? "Pass" : "Check"}</span></div>)}</div>
        </section>
      </div>
    </main>
  );
}

// BIBLIOTECA AVANZADA — COMPONENTS (Spanish)
// ════════════════════════════════════════════════════════════════════════════
function StatES({ valor, titulo }) {
  return <div className="rounded-2xl bg-white/10 p-4 backdrop-blur-sm"><div className="text-3xl font-bold">{valor}</div><div className="text-sm text-slate-200">{titulo}</div></div>;
}

function BotonCapitulo({ activo, onClick, icono, etiqueta, cantidad }) {
  return (
    <button type="button" onClick={onClick} className={cx("mb-3 w-full rounded-2xl border p-4 text-left transition-all", activo ? "border-blue-400 bg-blue-50" : "border-slate-200 bg-slate-50 hover:bg-slate-100")}>
      <div className="flex items-center gap-3"><span className="text-2xl">{icono}</span><div><div className="font-bold text-slate-800">{etiqueta}</div><div className="text-xs text-slate-500">{cantidad} tarjetas</div></div></div>
    </button>
  );
}

function BibliotecaAvanzadaTexasLifeHealth() {
  const [capituloActivo, setCapituloActivo] = useState("all");
  const [busqueda, setBusqueda] = useState("");
  const [tarjetaSeleccionada, setTarjetaSeleccionada] = useState({ ...capitulos[0].tarjetas[0], capituloId: capitulos[0].id, capituloTitulo: capitulos[0].titulo, capituloIcono: capitulos[0].icono, capituloColor: capitulos[0].color });
  const [herramientaActiva, setHerramientaActiva] = useState("biblioteca");

  const todasTarjetas = useMemo(() => capitulos.flatMap((cap) => cap.tarjetas.map((t) => ({ ...t, capituloId: cap.id, capituloTitulo: cap.titulo, capituloIcono: cap.icono, capituloColor: cap.color }))), []);
  const tarjetasFiltradas = useMemo(() => {
    const txt = busqueda.trim().toLowerCase();
    return todasTarjetas.filter((t) => { const match = capituloActivo === "all" || t.capituloId === capituloActivo; const s = [t.titulo, t.capituloTitulo, t.contenido, t.trampa, t.utilPara, ...t.etiquetas].join(" ").toLowerCase(); return match && (!txt || s.includes(txt)); });
  }, [capituloActivo, busqueda, todasTarjetas]);

  const revisiones = [
    { nombre:"Capítulos cargados", aprobado: capitulos.length >= 7 },
    { nombre:"Tarjetas cargadas", aprobado: todasTarjetas.length >= 25 },
    { nombre:"Buscador listo", aprobado: tarjetasFiltradas.length >= 0 },
    { nombre:"Hojas de memoria listas", aprobado: hojasMemoria.length >= 4 },
  ];

  return (
    <main className="min-h-screen bg-slate-100 p-6 text-slate-900">
      <div className="mx-auto max-w-7xl space-y-8">
        <section className="rounded-3xl bg-gradient-to-r from-slate-900 to-blue-900 p-8 text-white shadow-xl">
          <div className="flex flex-wrap items-center justify-between gap-6">
            <div><p className="mb-2 text-sm font-semibold uppercase tracking-wider text-cyan-200">Ensurity Academy</p><h1 className="text-4xl font-bold">Biblioteca Avanzada Texas Life & Health</h1><p className="mt-4 max-w-3xl text-lg text-slate-200">Centro de apoyo en español: explicaciones profundas, búsqueda por tema, hojas de memoria.</p></div>
            <div className="grid grid-cols-2 gap-3 text-center"><StatES valor={capitulos.length} titulo="Capítulos" /><StatES valor={todasTarjetas.length} titulo="Tarjetas" /><StatES valor={hojasMemoria.length} titulo="Hojas" /><StatES valor="TX" titulo="Enfoque" /></div>
          </div>
        </section>

        <section className="grid gap-4 md:grid-cols-4">
          {[["biblioteca","📚","Biblioteca","Buscar y abrir tarjetas"],["capitulos","🗂️","Capítulos","Explorar por unidad"],["memoria","🧠","Hojas de Memoria","Herramientas de repaso"],["recursos","🔗","Recursos","Cómo usar esta biblioteca"]].map(([id, icono, titulo, descripcion]) => (
            <button key={id} type="button" onClick={() => setHerramientaActiva(id)} className={cx("rounded-3xl border p-5 text-left shadow-lg transition-all hover:-translate-y-1 hover:shadow-xl", herramientaActiva === id ? "border-blue-400 bg-blue-50 ring-2 ring-blue-100" : "border-slate-200 bg-white")}>
              <div className="text-4xl">{icono}</div><h2 className="mt-3 text-xl font-bold">{titulo}</h2><p className="mt-2 text-sm text-slate-600">{descripcion}</p>
            </button>
          ))}
        </section>

        {herramientaActiva === "biblioteca" && (
          <section className="grid gap-6 lg:grid-cols-[300px_1fr]">
            <aside className="rounded-3xl border border-slate-200 bg-white p-5 shadow-lg">
              <h2 className="mb-4 text-xl font-bold">Capítulos</h2>
              <BotonCapitulo activo={capituloActivo === "all"} onClick={() => setCapituloActivo("all")} icono="🌎" etiqueta="Todos los Capítulos" cantidad={todasTarjetas.length} />
              {capitulos.map((cap) => <BotonCapitulo key={cap.id} activo={capituloActivo === cap.id} onClick={() => setCapituloActivo(cap.id)} icono={cap.icono} etiqueta={cap.titulo} cantidad={cap.tarjetas.length} />)}
            </aside>
            <section className="space-y-6">
              <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
                <label className="mb-3 block text-sm font-semibold uppercase tracking-wider text-slate-500">Buscar en Biblioteca</label>
                <input value={busqueda} onChange={(e) => setBusqueda(e.target.value)} placeholder="Buscar: beneficiario, Parte D, elimination period..." className="w-full rounded-2xl border border-slate-300 bg-slate-50 px-5 py-4 text-lg outline-none focus:border-blue-400 focus:ring-4 focus:ring-blue-100" />
                <p className="mt-3 text-sm text-slate-500">Mostrando {tarjetasFiltradas.length} tarjetas.</p>
              </div>
              <div className="grid gap-4 md:grid-cols-2">
                {tarjetasFiltradas.map((t) => (
                  <button key={`${t.capituloId}-${t.titulo}`} type="button" onClick={() => setTarjetaSeleccionada(t)} className={cx("rounded-3xl border bg-white p-6 text-left shadow-md transition-all hover:-translate-y-1 hover:shadow-xl", tarjetaSeleccionada.titulo === t.titulo ? "border-blue-400 ring-2 ring-blue-100" : "border-slate-200")}>
                    <div className="mb-4 flex items-center gap-3"><div className={cx("flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-r text-2xl text-white", t.capituloColor)}>{t.capituloIcono}</div><div><h3 className="font-bold text-slate-800">{t.titulo}</h3><p className="text-sm text-slate-500">{t.capituloTitulo}</p></div></div>
                    <p className="text-sm leading-relaxed text-slate-600">{t.contenido}</p>
                    <div className="mt-4 flex flex-wrap gap-2">{t.etiquetas.map((e) => <span key={e} className="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">{e}</span>)}</div>
                  </button>
                ))}
              </div>
            </section>
          </section>
        )}

        {herramientaActiva === "capitulos" && (
          <section className="grid gap-5 md:grid-cols-2 lg:grid-cols-3">
            {capitulos.map((cap) => (
              <article key={cap.id} className="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-lg">
                <div className={cx("bg-gradient-to-r p-6 text-white", cap.color)}><div className="text-5xl">{cap.icono}</div><h2 className="mt-4 text-2xl font-bold">{cap.titulo}</h2><p className="mt-2 text-white/90">{cap.resumen}</p></div>
                <div className="space-y-3 p-5">
                  {cap.tarjetas.map((t) => (
                    <button key={t.titulo} type="button" onClick={() => { setTarjetaSeleccionada({...t, capituloId:cap.id, capituloTitulo:cap.titulo, capituloIcono:cap.icono, capituloColor:cap.color}); setHerramientaActiva("biblioteca"); setCapituloActivo(cap.id); }} className="w-full rounded-2xl bg-slate-50 p-4 text-left font-semibold text-slate-700 transition-all hover:bg-blue-50">{t.titulo}</button>
                  ))}
                </div>
              </article>
            ))}
          </section>
        )}

        {herramientaActiva === "memoria" && (
          <section className="rounded-3xl border border-emerald-200 bg-emerald-50 p-6 shadow-lg">
            <h2 className="mb-2 text-3xl font-bold text-emerald-950">🧠 Hojas de Memoria</h2>
            <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
              {hojasMemoria.map((hoja) => <div key={hoja.titulo} className="rounded-3xl border border-emerald-200 bg-white p-6 shadow-sm"><h3 className="mb-4 text-xl font-bold text-slate-800">{hoja.titulo}</h3><div className="space-y-3">{hoja.puntos.map((p) => <div key={p} className="rounded-2xl bg-slate-50 p-3 font-medium text-slate-700">{p}</div>)}</div></div>)}
            </div>
          </section>
        )}

        {herramientaActiva === "recursos" && (
          <section className="rounded-3xl border border-purple-200 bg-purple-50 p-6 shadow-lg">
            <h2 className="mb-2 text-3xl font-bold text-purple-950">🔗 Recursos Extra</h2>
            <div className="grid gap-4 md:grid-cols-2">
              {recursos.map((r) => <div key={r.titulo} className="rounded-3xl border border-purple-200 bg-white p-6 shadow-sm"><div className="mb-4 flex items-center gap-4"><div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-purple-100 text-3xl">{r.icono}</div><h3 className="text-xl font-bold text-slate-800">{r.titulo}</h3></div><p className="leading-relaxed text-slate-600">{r.nota}</p></div>)}
            </div>
          </section>
        )}

        <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
          <div className="mb-4 flex items-center justify-between gap-4"><div><p className="text-sm font-semibold uppercase tracking-wider text-slate-500">Tarjeta Seleccionada</p><h2 className="mt-1 text-3xl font-bold text-slate-800">{tarjetaSeleccionada.titulo}</h2></div><div className="rounded-2xl bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-600">{tarjetaSeleccionada.capituloTitulo || "Referencia"}</div></div>
          <div className="grid gap-5 lg:grid-cols-3">
            <div className="rounded-3xl bg-slate-50 p-5 lg:col-span-2"><h3 className="mb-3 text-xl font-bold">Explicación</h3><p className="leading-relaxed text-slate-700">{tarjetaSeleccionada.contenido}</p></div>
            <div className="rounded-3xl border border-red-100 bg-red-50 p-5"><h3 className="mb-3 text-xl font-bold text-red-700">⚠️ Trampa del Examen</h3><p className="text-slate-700">{tarjetaSeleccionada.trampa}</p></div>
            <div className="rounded-3xl border border-blue-100 bg-blue-50 p-5"><h3 className="mb-3 text-xl font-bold text-blue-800">Útil Para</h3><p className="text-slate-700">{tarjetaSeleccionada.utilPara}</p></div>
            <div className="rounded-3xl bg-slate-50 p-5 lg:col-span-2"><h3 className="mb-3 text-xl font-bold">Etiquetas</h3><div className="flex flex-wrap gap-2">{tarjetaSeleccionada.etiquetas.map((e) => <span key={e} className="rounded-full bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm">{e}</span>)}</div></div>
          </div>
        </section>

        <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
          <h2 className="mb-4 text-2xl font-bold">Revisión Técnica</h2>
          <div className="grid gap-3 md:grid-cols-2">{revisiones.map((r) => <div key={r.nombre} className="flex items-center justify-between rounded-2xl bg-slate-100 p-4"><span className="font-medium text-slate-700">{r.nombre}</span><span className={r.aprobado ? "font-bold text-green-700" : "font-bold text-red-700"}>{r.aprobado ? "Listo" : "Revisar"}</span></div>)}</div>
        </section>
      </div>
    </main>
  );
}

// TABS ROUTER — single root, swap component on tab change
// ════════════════════════════════════════════════════════════════════════════
const TABS_COMPONENTS = [PlataformaTexasLifeHealthEspanolEspejo, TexasLifeHealthDeepDiveLibrary, BibliotecaAvanzadaTexasLifeHealth];
let _singleRoot = null;

window.renderActiveTab = function() {
  const idx = window._activeTab || 0;
  const el = document.getElementById('react-root');
  if (!_singleRoot) {
    _singleRoot = ReactDOM.createRoot(el);
  }
  const Comp = TABS_COMPONENTS[idx];
  _singleRoot.render(<Comp />);
};
</script>
