<script>
// Auth gate — show app only after verifying session
window._activeTab = 0;
window._libLang = localStorage.getItem('az_lang') === 'es' ? 'es' : 'en';

function syncLangUI(lang) {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const activeColor = isDark ? '#F1F5F9' : '#0F172A';
  const activeBg    = isDark ? '#1E293B' : '#fff';
  const inactiveColor = '#64748B';
  document.getElementById('lib-btn-en').style.background = lang === 'en' ? activeBg : 'transparent';
  document.getElementById('lib-btn-en').style.color      = lang === 'en' ? activeColor : inactiveColor;
  document.getElementById('lib-btn-en').style.boxShadow  = lang === 'en' ? '0 1px 3px rgba(0,0,0,.15)' : 'none';
  document.getElementById('lib-btn-es').style.background = lang === 'es' ? activeBg : 'transparent';
  document.getElementById('lib-btn-es').style.color      = lang === 'es' ? activeColor : inactiveColor;
  document.getElementById('lib-btn-es').style.boxShadow  = lang === 'es' ? '0 1px 3px rgba(0,0,0,.15)' : 'none';
  const tabs = document.querySelectorAll('.tlh-tab');
  if (tabs[0]) tabs[0].textContent = lang === 'es' ? 'Plataforma' : 'Platform';
  if (tabs[1]) tabs[1].textContent = lang === 'es' ? 'Biblioteca' : 'Library';
}

function setLibLang(lang) {
  window._libLang = lang;
  localStorage.setItem('az_lang', lang);
  syncLangUI(lang);
  window.renderActiveTab();
}

function toggleTLHDark() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('az_theme', next);
  document.getElementById('tlh-icon-moon').style.display = next === 'dark' ? 'none' : 'block';
  document.getElementById('tlh-icon-sun').style.display  = next === 'dark' ? 'block' : 'none';
  setLibLang(window._libLang);
}

// Apply saved dark mode icon on load
(function() {
  if (localStorage.getItem('az_theme') === 'dark') {
    document.getElementById('tlh-icon-moon').style.display = 'none';
    document.getElementById('tlh-icon-sun').style.display  = 'block';
  }
})();

// Apply saved language (shared with main dashboard) on load
syncLangUI(window._libLang);

function setTab(idx) {
  window._activeTab = idx;
  document.querySelectorAll('.tlh-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  window.renderActiveTab();
}

async function boot() {
  const waitAZ = () => new Promise(r => { const t = setInterval(() => { if (window.AZ) { clearInterval(t); r(); } }, 80); });
  await waitAZ();
  const user = await window.AZ.Auth.getCurrentUser();
  if (!user) { window.location.href = '/'; return; }
  document.getElementById('app-shell').style.display = 'block';
  renderActiveTab();
}
boot();
</script>

  { id:"fundamentos-seguro", unit:"Fundamentos del Seguro", title:"Fundamentos del Seguro", titleEN:"Insurance Fundamentals", icon:"📘", color:"from-sky-600 to-blue-400", summary:"Conceptos básicos del seguro y contract law que aparecen mucho en el examen de Texas.", keyPoints:["El interés asegurable debe existir cuando se compra o emite la póliza.","Adhesión significa que la aseguradora redacta el contrato.","Aleatorio significa que hay un intercambio desigual.","Indemnización intenta restaurar financieramente a una persona después de una pérdida.","Representaciones son declaraciones que se creen verdaderas.","La Ley de los Grandes Números ayuda a las aseguradoras a predecir pérdidas."], quickTable:[["Adhesión","Aseguradora redacta","Ambigüedad favorece al asegurado"],["Aleatorio","Intercambio desigual","Prima vs beneficio grande"],["Interés Asegurable","Relación financiera/emocional","Requerido al inicio"],["Representación","Se cree verdadera","No es garantía absoluta"]], examTrap:"El interés asegurable en seguro de vida se requiere al emitir/comprar la póliza, no necesariamente al momento de la muerte.", summaryEN:"Core insurance concepts and contract law that appear frequently on the Texas exam.", keyPointsEN:["Insurable interest must exist when the policy is purchased or issued.","Adhesion means the insurer writes the contract.","Aleatory means there is an unequal exchange.","Indemnity attempts to restore a person financially after a loss.","Representations are statements believed to be true.","The Law of Large Numbers helps insurers predict losses."], quickTableEN:[["Adhesion","Insurer writes it","Ambiguity favors the insured"],["Aleatory","Unequal exchange","Premium vs. large benefit"],["Insurable Interest","Financial/emotional relationship","Required at inception"],["Representation","Believed true","Not an absolute guarantee"]], examTrapEN:"Insurable interest for life insurance is required at policy issue/purchase, not necessarily at the time of death." },
  { id:"basicos-vida", unit:"Tipos de Pólizas de Vida", title:"Fundamentos del Seguro de Vida", titleEN:"Life Insurance Basics", icon:"🛡️", color:"from-blue-500 to-cyan-400", summary:"Aprende los tipos principales de pólizas y cómo el examen las compara.", keyPoints:["Term Life es protección temporal sin cash value.","Whole Life es cobertura permanente con primas fijas y cash value garantizado.","Universal Life es flexible: primas flexibles y death benefit ajustable.","Variable Life involucra inversiones, separate accounts y regulación de securities."], quickTable:[["Term Life","Temporal","Sin cash value","Protección pura por fallecimiento"],["Whole Life","Permanente","Cash value","Prima fija"],["Universal Life","Permanente","Cash value","Prima flexible"],["Variable Life","Permanente","Separate account","Riesgo de inversión"]], examTrap:"Universal = flexibilidad. Variable = inversiones. No los confundas.", summaryEN:"Learn the main policy types and how the exam compares them.", keyPointsEN:["Term Life is temporary protection with no cash value.","Whole Life is permanent coverage with fixed premiums and guaranteed cash value.","Universal Life is flexible: flexible premiums and an adjustable death benefit.","Variable Life involves investments, separate accounts, and securities regulation."], quickTableEN:[["Term Life","Temporary","No cash value","Pure death protection"],["Whole Life","Permanent","Cash value","Fixed premium"],["Universal Life","Permanent","Cash value","Flexible premium"],["Variable Life","Permanent","Separate account","Investment risk"]], examTrapEN:"Universal = flexibility. Variable = investments. Don't confuse them." },
  { id:"riders", unit:"Riders", title:"Riders de Seguro de Vida", titleEN:"Life Insurance Riders", icon:"📑", color:"from-purple-500 to-pink-400", summary:"Los riders modifican una póliza agregando beneficios o cobertura extra.", keyPoints:["Waiver of Premium exonera primas si el asegurado queda discapacitado.","Guaranteed Insurability permite aumentos futuros sin prueba de insurability.","Payor Rider es común en pólizas juveniles si el adulto pagador muere o queda discapacitado.","Accidental Death Benefit paga un beneficio adicional por muerte accidental cubierta.","Long-Term Care Rider puede acelerar el death benefit para necesidades de cuidado prolongado."], quickTable:[["Waiver of Premium","Discapacidad","Primas exoneradas"],["Guaranteed Insurability","Cobertura futura","Sin preguntas médicas"],["Payor Rider","Póliza juvenil","Protege si el adulto pagador muere/discapacita"],["ADB","Muerte accidental","Beneficio adicional"]], examTrap:"Un rider no es una póliza separada. Se agrega a una póliza para modificarla.", summaryEN:"Riders modify a policy by adding extra benefits or coverage.", keyPointsEN:["Waiver of Premium waives premiums if the insured becomes disabled.","Guaranteed Insurability allows future increases without proof of insurability.","Payor Rider is common on juvenile policies if the adult payor dies or becomes disabled.","Accidental Death Benefit pays an additional benefit for a covered accidental death.","Long-Term Care Rider can accelerate the death benefit for extended care needs."], quickTableEN:[["Waiver of Premium","Disability","Premiums waived"],["Guaranteed Insurability","Future coverage","No medical questions"],["Payor Rider","Juvenile policy","Protects if the adult payor dies/becomes disabled"],["ADB","Accidental death","Additional benefit"]], examTrapEN:"A rider is not a separate policy. It's added to a policy to modify it." },

function StatCard({ value, label }) {
  return <div className="rounded-2xl bg-white/15 p-4 backdrop-blur-sm"><div className="text-3xl font-bold">{value}</div><div className="text-sm opacity-90">{label}</div></div>;
}

function MiniQuiz({ pregunta, respuestaSeleccionada, setRespuestaSeleccionada, t }) {
  return (
    <div className="rounded-3xl border border-slate-200 bg-slate-50 p-5">
      <h3 className="mb-3 text-xl font-bold">{t("Mini Examen","Mini Quiz")}</h3>
      <p className="mb-4 font-semibold text-slate-800">{pregunta.question}</p>
      <div className="grid gap-3 md:grid-cols-2">
        {pregunta.choices.map((choice) => {
          const selected = respuestaSeleccionada === choice;
          const correct = choice === pregunta.answer;
          return <button key={choice} type="button" onClick={() => setRespuestaSeleccionada(choice)} className={cx("rounded-2xl border p-4 text-left font-semibold transition-all", !respuestaSeleccionada && "border-slate-200 bg-white hover:bg-blue-50", respuestaSeleccionada && correct && "border-green-300 bg-green-50 text-green-800", respuestaSeleccionada && selected && !correct && "border-red-300 bg-red-50 text-red-800", respuestaSeleccionada && !selected && !correct && "border-slate-200 bg-white opacity-70")}>{choice}</button>;
        })}
      </div>
      {respuestaSeleccionada && <div className="mt-4 rounded-2xl bg-white p-4"><p className="font-bold text-slate-800">{respuestaSeleccionada === pregunta.answer ? t("Correcto 🎉","Correct 🎉") : t("No exactamente — repasa esta.","Not quite — review this one.")}</p><p className="mt-2 text-slate-700">{pregunta.explanation}</p><button type="button" onClick={() => setRespuestaSeleccionada("")} className="mt-4 rounded-xl bg-slate-900 px-4 py-2 font-semibold text-white">{t("Intentar de nuevo","Try again")}</button></div>}
    </div>
  );
}

function MockExamView({ unidadesExamen, filtroExamen, setFiltroExamen, resetExamen, examenIniciado, setExamenIniciado, mostrarResultados, poolPreguntas, preguntaActual, preguntaExamen, respuestaExamen, setRespuestaExamen, enviarRespuestaExamen, score, respuestasExamen, t }) {

      {!examenIniciado && !mostrarResultados && <div className="rounded-3xl bg-slate-50 p-8 text-center border border-slate-200"><h3 className="mb-4 text-2xl font-bold text-slate-800">{t("Elige el Tipo de Práctica","Choose Practice Type")}</h3><select value={filtroExamen} onChange={(e) => { setFiltroExamen(e.target.value); resetExamen(); }} className="mb-6 w-full max-w-xl rounded-2xl border border-slate-300 bg-white px-5 py-4 text-lg outline-none focus:border-blue-400">{unidadesExamen.map((u) => <option key={u}>{u}</option>)}</select><br /><button type="button" onClick={() => setExamenIniciado(true)} className="rounded-2xl bg-blue-600 px-6 py-4 text-lg font-semibold text-white hover:bg-blue-700">{t("Iniciar Examen de Práctica","Start Practice Exam")}</button></div>}
      {examenIniciado && !mostrarResultados && <div className="space-y-6"><div className="flex items-center justify-between flex-wrap gap-3"><div className="text-sm font-semibold uppercase tracking-wider text-slate-500">{t("Pregunta","Question")} {preguntaActual + 1} {t("de","of")} {poolPreguntas.length}</div><div className="rounded-full bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700">{t("Puntaje","Score")}: {score}</div></div><div className="w-full rounded-full bg-slate-200 h-4 overflow-hidden"><div className="h-full bg-gradient-to-r from-blue-500 to-cyan-400 transition-all" style={{ width:`${((preguntaActual+1)/poolPreguntas.length)*100}%` }} /></div><div className="rounded-3xl border border-slate-200 bg-slate-50 p-8"><div className="mb-3 rounded-full bg-indigo-100 px-3 py-2 text-sm font-semibold text-indigo-700 inline-flex">{preguntaExamen.unit}</div><h3 className="mb-6 text-2xl font-bold text-slate-800">{preguntaExamen.question}</h3><div className="grid gap-4 md:grid-cols-2">{preguntaExamen.choices.map((choice) => <button key={choice} type="button" onClick={() => setRespuestaExamen(choice)} className={cx("rounded-2xl border p-5 text-left font-semibold transition-all", respuestaExamen === choice ? "border-blue-400 bg-blue-50 text-blue-800" : "border-slate-200 bg-white hover:bg-slate-100")}>{choice}</button>)}</div><button type="button" onClick={enviarRespuestaExamen} disabled={!respuestaExamen} className="mt-6 rounded-2xl bg-emerald-600 px-6 py-4 font-semibold text-white hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed">{t("Enviar Respuesta","Submit Answer")}</button></div></div>}
      {mostrarResultados && <div className="rounded-3xl bg-slate-50 border border-slate-200 p-8 text-center"><h3 className="mb-4 text-3xl font-bold text-slate-800">{t("Examen Completado","Exam Complete")}</h3><div className="mb-4 text-6xl font-bold text-blue-700">{Math.round((score/poolPreguntas.length)*100)}%</div><p className="mb-8 text-lg text-slate-600">{score} {t("de","of")} {poolPreguntas.length} {t("correctas.","correct.")}</p><button type="button" onClick={resetExamen} className="mb-8 rounded-2xl bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700">{t("Repetir / Elegir Otra Unidad","Retake / Choose Another Unit")}</button><div className="grid gap-4 text-left max-w-4xl mx-auto">{respuestasExamen.map((a, i) => <div key={i} className={cx("rounded-2xl p-5 border", a.isCorrect ? "bg-green-50 border-green-200" : "bg-red-50 border-red-200")}><p className="mb-1 text-sm font-bold text-slate-500">{a.unit}</p><p className="font-bold mb-2">{a.question}</p><p>{t("Tu Respuesta","Your Answer")}: {a.selected}</p><p>{t("Correcta","Correct")}: {a.correct}</p></div>)}</div></div>}
    </section>
  );
}

function PlataformaTexasLifeHealthEspanolEspejo() {
  const TAB_INICIO = 0;
  const TAB_REPASO = lecciones.length + 1;
  const TAB_MOCK   = lecciones.length + 2;

  const t = (es, en) => window._libLang === 'es' ? es : en;

  const consejos = [
    t("Enfócate en entender conceptos, no solo memorizar definiciones.", "Focus on understanding concepts, not just memorizing definitions."),
    t("Practica comparar pólizas y provisiones similares lado a lado.", "Practice comparing similar policies and provisions side by side."),
    t("Disability y Medicare suelen ser áreas donde más se falla — repásalas varias veces.", "Disability and Medicare are the most-failed areas — review them multiple times."),
    t("Usa el Mock Exam la noche antes del examen para medir tu nivel.", "Use the Mock Exam the night before your test to gauge your readiness."),
  ];

  const tourSteps = [
    { tab: TAB_INICIO, label: t("Inicio","Home"), desc: t("Tu pantalla de bienvenida con consejos prácticos y el botón de primeros pasos.","Your welcome screen with practical tips and the first-steps button.") },
    ...lecciones.map((l, i) => ({ tab: i + 1, label: t(l.title, l.titleEN), desc: l.summary })),
    { tab: TAB_REPASO, label: t("Repaso Rápido","Quick Review"), desc: t("Cram cards y Night Before Review para repasar antes del examen.","Cram cards and Night Before Review to recap before your exam.") },
    { tab: TAB_MOCK,   label: "Mock Exam", desc: t("Practica con preguntas de todas las unidades y revisa tu score al finalizar.","Practice with questions from all units and review your score when done.") },
  ];

  const [showConsejos, setShowConsejos] = useState(() => !sessionStorage.getItem('tlh_consejos_shown'));
  const [tabActivo, setTabActivo]       = useState(TAB_INICIO);
  const [tourStep, setTourStep]         = useState(null);
  const [respuestaLeccion, setRespuestaLeccion] = useState("");
  const [examenIniciado, setExamenIniciado]     = useState(false);
  const [preguntaActual, setPreguntaActual]     = useState(0);
  const [respuestaExamen, setRespuestaExamen]   = useState("");
  const [respuestasExamen, setRespuestasExamen] = useState([]);
  const [mostrarResultados, setMostrarResultados] = useState(false);
  const [filtroExamen, setFiltroExamen] = useState("Todas las Unidades");
  const [cramIndex, setCramIndex]   = useState(0);
  const [mostrarCram, setMostrarCram] = useState(false);

  const isLeccion   = tabActivo >= 1 && tabActivo <= lecciones.length;
  const leccionActiva = lecciones[tabActivo - 1] || lecciones[0];
  const unitEN = { "Fundamentos del Seguro":"Insurance Fundamentals", "Tipos de Pólizas de Vida":"Life Insurance Policy Types", "Riders":"Riders", "Provisiones de Póliza":"Policy Provisions", "Opciones de Póliza":"Policy Options", "Disability Income":"Disability Income", "Medicare y Medicaid":"Medicare and Medicaid", "Underwriting y Ley de Texas":"Underwriting and Texas Law" };
  const preguntasMockActual = window._libLang === 'es' ? preguntasMock : preguntasMockEN;
  const unidadTodas = t("Todas las Unidades","All Units");
  const unitES = useMemo(() => { const rev = {}; Object.keys(unitEN).forEach((es) => { rev[unitEN[es]] = es; }); return rev; }, []);
  // filtroExamen stores whatever language's unit label was selected in the
  // dropdown. On a language toggle it goes stale (e.g. still the Spanish
  // name while everything else is now English), and preguntasMockActual
  // filters against it and comes back empty, so preguntaExamen becomes
  // undefined and the exam view crashes to a blank screen. Always resolve
  // it to the current language's equivalent before using it.
  const filtroExamenActual = useMemo(() => {
    if (filtroExamen === unidadTodas || filtroExamen === "Todas las Unidades" || filtroExamen === "All Units") return unidadTodas;
    return window._libLang === 'es' ? (unitES[filtroExamen] || filtroExamen) : (unitEN[filtroExamen] || filtroExamen);
  }, [filtroExamen, window._libLang]);
  const preguntaLeccion = useMemo(() => {
    const currentUnitEs = (lecciones[tabActivo - 1] || lecciones[0]).unit;
    const currentUnit = window._libLang === 'es' ? currentUnitEs : (unitEN[currentUnitEs] || currentUnitEs);
    return preguntasMockActual.find((p) => p.unit === currentUnit) || preguntasMockActual[0];
  }, [tabActivo, window._libLang]);
  const cramCardsActual = window._libLang === 'es' ? cramCards : cramCardsEN;
  const cramActual  = cramCardsActual[cramIndex];
  const unidadesExamen = [unidadTodas, ...Array.from(new Set(preguntasMockActual.map((p) => p.unit)))];
  const poolPreguntas  = useMemo(() => filtroExamenActual === unidadTodas ? preguntasMockActual : preguntasMockActual.filter((p) => p.unit === filtroExamenActual), [filtroExamenActual, unidadTodas, window._libLang]);
  const preguntaExamen = poolPreguntas[preguntaActual] || poolPreguntas[0];
  const score = respuestasExamen.filter((r) => r.isCorrect).length;

  const resetExamen = () => { setExamenIniciado(false); setPreguntaActual(0); setRespuestaExamen(""); setRespuestasExamen([]); setMostrarResultados(false); };
  const enviarRespuestaExamen = () => {
    if (!respuestaExamen) return;
    const nuevas = [...respuestasExamen, { unit: preguntaExamen.unit, question: preguntaExamen.question, selected: respuestaExamen, correct: preguntaExamen.answer, isCorrect: respuestaExamen === preguntaExamen.answer }];
    setRespuestasExamen(nuevas);
    setRespuestaExamen("");
    if (preguntaActual + 1 >= poolPreguntas.length) setMostrarResultados(true);
    else setPreguntaActual(preguntaActual + 1);
  };
  const siguienteCram = () => { setMostrarCram(false); setCramIndex((i) => (i + 1) % cramCardsActual.length); };
  const anteriorCram  = () => { setMostrarCram(false); setCramIndex((i) => (i - 1 + cramCardsActual.length) % cramCardsActual.length); };

  const startTour = () => { sessionStorage.setItem('tlh_consejos_shown','1'); setShowConsejos(false); setTourStep(0); setTabActivo(tourSteps[0].tab); };
  const tourNext  = () => {
    if (tourStep + 1 < tourSteps.length) { const n = tourStep + 1; setTourStep(n); setTabActivo(tourSteps[n].tab); }
    else endTour();
  };
  const endTour = () => { setTourStep(null); setTabActivo(TAB_INICIO); localStorage.setItem('tlh_tour_done','1'); };

  const handleEntendido = () => {
    sessionStorage.setItem('tlh_consejos_shown','1');
    if (!localStorage.getItem('tlh_tour_done')) startTour();
    else setShowConsejos(false);
  };

  const tourHighlight = (idx) => tourStep !== null && tourSteps[tourStep].tab === idx ? "tlh-tab-highlighted" : "";

  return (
    <main className="min-h-screen bg-slate-100 p-6 text-slate-900">

      {showConsejos && (
        <div className="tlh-modal-backdrop" onClick={() => { sessionStorage.setItem('tlh_consejos_shown','1'); setShowConsejos(false); }}>
          <div className="tlh-modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="tlh-modal-badge">Academia Ensurity</div>
            <h2 className="tlh-modal-title">{t("Consejos Prácticos","Practical Tips")}</h2>
            <p className="tlh-modal-sub">{t("Antes de comenzar, ten esto en mente","Before starting, keep these in mind")}</p>
            {consejos.map((c, i) => (
              <div key={i} className="tlh-consejo-item" style={{ animation:`tlh-item-in .35s ease ${.18 + i * .09}s forwards` }}>
                <span className="tlh-consejo-num">0{i + 1}</span>
                <p className="tlh-consejo-text">{c}</p>
              </div>
            ))}
            <button className="tlh-modal-btn" onClick={handleEntendido}>{t("Entendido, comenzar","Got it, let's start")}</button>
          </div>
        </div>
      )}

      {tourStep !== null && <div className="tlh-tour-overlay" />}

      {tourStep !== null && (
        <div className="tlh-tour-card">
          <div className="tlh-tour-dots">
            {tourSteps.map((_, i) => <div key={i} className={cx("tlh-tour-dot", tourStep === i ? "active" : "")} />)}
          </div>
          <p className="text-xs font-bold uppercase tracking-wider text-blue-500 mb-1">{tourStep + 1} / {tourSteps.length} — {tourSteps[tourStep].label}</p>
          <p className="text-sm text-slate-700 leading-relaxed mb-4">{tourSteps[tourStep].desc}</p>
          <div className="flex gap-2 items-center">
            <button type="button" onClick={endTour} className="text-sm text-slate-400 hover:text-slate-600 px-3 py-2 rounded-xl hover:bg-slate-100 transition-all">{t("Omitir tour","Skip tour")}</button>
            <button type="button" onClick={tourNext} className="flex-1 rounded-xl bg-blue-600 text-white font-semibold text-sm py-2 hover:bg-blue-700 transition-all">
              {tourStep + 1 < tourSteps.length ? t("Siguiente →","Next →") : t("Finalizar tour","Finish tour")}
            </button>
          </div>
        </div>
      )}

      <div className="mx-auto max-w-7xl space-y-6">

        <div className="flex flex-wrap gap-2" style={{ position:'relative', zIndex: tourStep !== null ? 160 : 'auto' }}>
          <button type="button" onClick={() => setTabActivo(TAB_INICIO)}
            className={cx("rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap transition-all border",
              tabActivo === TAB_INICIO ? "bg-blue-600 text-white border-blue-600 shadow" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50",
              tourHighlight(TAB_INICIO))}>
            {t("Inicio","Home")}
          </button>
          {lecciones.map((l, i) => (
            <button key={l.id} type="button" onClick={() => { setTabActivo(i + 1); setRespuestaLeccion(""); }}
              className={cx("rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap transition-all border",
                tabActivo === i + 1 ? "bg-blue-600 text-white border-blue-600 shadow" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50",
                tourHighlight(i + 1))}>
              {t(l.title, l.titleEN)}
            </button>
          ))}
          <button type="button" onClick={() => setTabActivo(TAB_REPASO)}
            className={cx("rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap transition-all border",
              tabActivo === TAB_REPASO ? "bg-blue-600 text-white border-blue-600 shadow" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50",
              tourHighlight(TAB_REPASO))}>
            {t("Repaso Rápido","Quick Review")}
          </button>
          <button type="button" onClick={() => setTabActivo(TAB_MOCK)}
            className={cx("rounded-xl px-4 py-2 text-sm font-semibold whitespace-nowrap transition-all border",
              tabActivo === TAB_MOCK ? "bg-blue-600 text-white border-blue-600 shadow" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50",
              tourHighlight(TAB_MOCK))}>
            {t("Examen de Práctica","Mock Exam")}
          </button>
        </div>

        {tabActivo === TAB_INICIO && (
          <div className="space-y-6">
            <div className="rounded-3xl bg-gradient-to-r from-blue-700 to-cyan-500 p-8 text-white shadow-xl">
              <p className="text-sm font-semibold uppercase tracking-wider text-white/70 mb-2">{t("Licencia de Texas Life &amp; Health","Texas Life &amp; Health Licensing")}</p>
              <h2 className="text-3xl font-bold mb-2">{t("Bienvenido al Módulo","Welcome to the Module")}</h2>
              <p className="text-white/85 max-w-xl mb-6">{t("Todo lo que necesitas para pasar tu examen: lecciones por unidad, flashcards de repaso y mock exam completo.","Everything you need to pass your exam: unit lessons, review flashcards, and a full mock exam.")}</p>
              <button type="button" onClick={startTour}
                className="rounded-2xl bg-white/15 border border-white/30 px-5 py-3 font-semibold text-white hover:bg-white/25 transition-all">
                {t("Comenzar Primeros Pasos →","Start First Steps →")}
              </button>
            </div>
            <div className="rounded-3xl bg-white border border-slate-200 p-8 shadow-lg">
              <h3 className="text-xl font-bold text-slate-800 mb-5">{t("Consejos Prácticos","Practical Tips")}</h3>
              <div className="grid gap-4 md:grid-cols-2">
                {consejos.map((c, i) => (
                  <div key={i} className="flex gap-3 rounded-2xl bg-slate-50 border border-slate-100 p-4">
                    <span className="text-xs font-bold text-blue-600 bg-blue-100 rounded-lg px-2 py-1 h-fit shrink-0 mt-0.5">0{i + 1}</span>
                    <p className="text-sm text-slate-700 leading-relaxed">{c}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {isLeccion && (
          <article className="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-lg">

            <div className="grid gap-4 md:grid-cols-2">
              {tarjetasFiltradas.map((t) => (
                <button key={`${t.capituloId}-${t.titulo}`} type="button" onClick={() => setTarjetaSeleccionada(t)} className={cx("rounded-3xl border bg-white p-6 text-left shadow-md transition-all hover:-translate-y-1 hover:shadow-xl", tarjetaSeleccionada.titulo === t.titulo ? "border-blue-400 ring-2 ring-blue-100" : "border-slate-200")}>
                  <h3 className="font-bold text-slate-800 mb-1">{t.titulo}</h3>
                  <p className="text-xs font-semibold text-slate-400 mb-3">{t.capituloTitulo}</p>
                  <p className="text-sm leading-relaxed text-slate-600 line-clamp-3">{t.contenido}</p>
                </button>
              ))}
            </div>
            <article className="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-lg">
              <div className={cx("bg-gradient-to-r p-6 text-white", tarjetaSeleccionada.capituloColor)}>
                <h2 className="text-2xl font-bold">{tarjetaSeleccionada.titulo}</h2>
                <p className="mt-1 text-sm text-white/80">{tarjetaSeleccionada.capituloTitulo}</p>
              </div>
              <div className="space-y-5 p-6">
                <div><h3 className="mb-2 text-lg font-bold">Explicación</h3><p className="leading-relaxed text-slate-700">{tarjetaSeleccionada.contenido}</p></div>
                <div className="rounded-2xl border border-red-100 bg-red-50 p-5"><h3 className="mb-2 text-lg font-bold text-red-700">Trampa del Examen</h3><p className="text-slate-700">{tarjetaSeleccionada.trampa}</p></div>
              </div>
            </article>
          </>
        )}

        {tabActivo === TAB_MEMORIA && (
          <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
            <h2 className="mb-5 text-2xl font-bold text-slate-800">Hojas de Memoria</h2>
            <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
              {hojasMemoria.map((hoja) => <div key={hoja.titulo} className="rounded-2xl border border-slate-200 bg-slate-50 p-5"><h3 className="mb-4 text-lg font-bold text-slate-800">{hoja.titulo}</h3><div className="space-y-2">{hoja.puntos.map((p) => <div key={p} className="rounded-xl bg-white border border-slate-100 p-3 text-sm font-medium text-slate-700">{p}</div>)}</div></div>)}
            </div>
          </section>
        )}

        {tabActivo === TAB_RECURSOS && (
          <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg">
            <h2 className="mb-5 text-2xl font-bold text-slate-800">Recursos</h2>
            <div className="grid gap-4 md:grid-cols-2">
              {recursos.map((r) => <div key={r.titulo} className="rounded-2xl border border-slate-200 bg-slate-50 p-5"><h3 className="mb-2 text-lg font-bold text-slate-800">{r.titulo}</h3><p className="text-sm leading-relaxed text-slate-600">{r.nota}</p></div>)}
            </div>
          </section>
        )}

      </div>
    </main>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// TABS ROUTER — single root, swap component on tab change
// ════════════════════════════════════════════════════════════════════════════
let _singleRoot = null;

window.renderActiveTab = function() {
  const idx = window._activeTab || 0;
  const el = document.getElementById('react-root');
  if (!_singleRoot) {
    _singleRoot = ReactDOM.createRoot(el);
  }
  let Comp;
  if (idx === 0) {
    Comp = PlataformaTexasLifeHealthEspanolEspejo;
  } else {
    Comp = window._libLang === 'es' ? BibliotecaAvanzadaTexasLifeHealth : TexasLifeHealthDeepDiveLibrary;
  }
  _singleRoot.render(<Comp />);
};
</script>
</body>
</html>
